<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SerCerca 💚</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f8f6;
  color: #17332b;
}

header {
  background: #17332b;
  color: white;
  padding: 24px 18px;
  text-align: center;
}

.logo {
  font-size: 32px;
  font-weight: bold;
}

.logo span {
  color: #9ed1bd;
}

header p {
  margin-bottom: 0;
}

main {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

.screen {
  display: none;
}

.screen.active {
  display: block;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 22px;
  margin-bottom: 18px;
  box-shadow: 0 4px 18px rgba(0,0,0,0.07);
}

h1, h2, h3 {
  margin-top: 0;
}

.subtitle {
  color: #55736a;
}

.mood-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

button {
  border: none;
  border-radius: 14px;
  padding: 15px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  background: #2f6f5e;
  color: white;
}

button:hover {
  opacity: 0.9;
}

.mood {
  background: #eef6f2;
  color: #17332b;
  font-size: 18px;
}

.help {
  background: #9b3d3d;
}

.secondary {
  background: #e7f0ec;
  color: #17332b;
}

.message {
  background: #edf7f1;
  border-left: 5px solid #2f6f5e;
  padding: 15px;
  border-radius: 10px;
  margin-top: 15px;
}

.contact {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid #eee;
  padding: 14px 0;
}

.contact:last-child {
  border-bottom: none;
}

.small-button {
  padding: 9px 12px;
  font-size: 14px;
}

nav {
  position: sticky;
  bottom: 0;
  background: white;
  border-top: 1px solid #ddd;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  max-width: 700px;
  margin: auto;
}

nav button {
  background: white;
  color: #17332b;
  border-radius: 0;
  font-size: 13px;
  padding: 13px 5px;
}

nav button.active {
  color: #2f6f5e;
}

footer {
  text-align: center;
  padding: 25px;
  color: #668078;
  font-size: 14px;
}

@media (max-width: 450px) {
  .mood-grid {
    grid-template-columns: 1fr;
  }

  .contact {
    align-items: flex-start;
    flex-direction: column;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">Ser<span>Cerca</span> 💚</div>
  <p>No estamos para vigilarte. Estamos para estar cerca.</p>
</header>

<main>

<!-- INICIO -->
<section id="inicio" class="screen active">

  <div class="card">
    <h1>Buenos días, <span id="userName">María</span> 🌷</h1>
    <p class="subtitle">Nos alegra tener noticias de ti.</p>

    <h2>¿Cómo te encuentras hoy?</h2>

    <div class="mood-grid">
      <button class="mood" onclick="setMood('Muy bien','💚')">😊 Muy bien</button
