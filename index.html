<body>

<div id="app"></div>

<script type="module">

/* =========================================================
   FIREBASE
========================================================= */

import {
initializeApp
} from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";

import {
getDatabase,
ref,
set,
push,
onValue,
get,
update
} from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-database.js";

const firebaseConfig={
apiKey:"TU_API_KEY",
authDomain:"TU_PROYECTO.firebaseapp.com",
databaseURL:"https://TU_PROYECTO-default-rtdb.firebaseio.com",
projectId:"TU_PROJECT_ID",
storageBucket:"TU_PROYECTO.firebasestorage.app",
messagingSenderId:"TU_MESSAGING_SENDER_ID",
appId:"TU_APP_ID"
};

let firebaseApp=null;
let auth=null;
let db=null;

try{
firebaseApp=initializeApp(firebaseConfig);
auth=getAuth(firebaseApp);
db=getDatabase(firebaseApp);
}catch(error){
console.error("Firebase no configurado:",error);
}
/* =========================================================
   DATOS
========================================================= */

const KEY="sercerca_v4";

const DEFAULT={
logged:false,
onboarding:true,
step:1,
page:"home",
user:{
uid:"",
name:"",
email:""
},
profile:{
name:"",
email:"",
phone:"",
city:"",
notes:""
},
role:"",
contacts:[],
notifications:[],
messages:[],
history:[],
wellness:{
answers:{},
status:"",
activity:"",
last:"",
questionIndex:0
},
sharing:{
checkin:true,
wellness:true,
activity:true,
messages:true
},
plan:"Básico",
trial:{
active:false,
start:"",
end:""
},
settings:{
notifications:true,
activity:true,
location:false
}
};

/* =========================================================
   UTILIDADES
========================================================= */

function copy(x){
return JSON.parse(JSON.stringify(x));
}

function merge(base,data){
Object.keys(data||{}).forEach(k=>{
if(data[k] && typeof data[k]==="object" && !Array.isArray(data[k])){
base[k]={...base[k],...data[k]};
}else{
base[k]=data[k];
}
});
return base;
}

function load(){
try{
const saved=JSON.parse(localStorage.getItem(KEY));
if(!saved){
return copy(DEFAULT);
}
return merge(copy(DEFAULT),saved);
}catch(e){
return copy(DEFAULT);
}
}

let S=load();

function save(){
localStorage.setItem(KEY,JSON.stringify(S));
}

function esc(x){
return String(x??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;");
}

function time(){
return new Date().toLocaleString("es-ES",{dateStyle:"short",timeStyle:"short"});
}

function initials(name){
return (name||"?")
.split(" ")
.map(x=>x[0])
.join("")
.substring(0,2)
.toUpperCase();
}

function toast(text){
const t=document.createElement("div");
t.className="toast";
t.textContent=text;
document.body.appendChild(t);
setTimeout(()=>t.remove(),2500);
}

function history(action,detail=""){
S.history.unshift({
id:Date.now(),
action,
detail,
date:time()
});
S.history=S.history.slice(0,150);
}

function notification(text,type="info"){
if(!S.settings.notifications){
return;
}
S.notifications.unshift({
id:Date.now(),
text,
type,
date:time(),
read:false
});
}

function go(page){
S.page=page;
save();
render();
window.scrollTo({top:0,behavior:"smooth"});
}

/* =========================================================
   FIREBASE
========================================================= */

function firebaseReady(){
return !!(auth && db && auth.currentUser);
}

function firebaseError(error){
console.error(error);
const code=error?.code||"";
if(code.includes("email-already-in-use")){
return "Ese correo ya tiene una cuenta.";
}
if(code.includes("invalid-credential") || code.includes("wrong-password") || code.includes("user-not-found")){
return "Correo o contraseña incorrectos.";
}
if(code.includes("weak-password")){
return "La contraseña debe tener al menos 6 caracteres.";
}
if(code.includes("invalid-email")){
return "El correo no es válido.";
}
if(code.includes("network")){
return "No hay conexión con Internet.";
}
return "Ha ocurrido un error. Inténtalo de nuevo.";
}

/* =========================================================
   PERFIL EN FIREBASE
========================================================= */

async function saveCloudProfile(){
if(!firebaseReady()){
return false;
}
try{
const uid=auth.currentUser.uid;
await set(ref(db,"users/"+uid+"/profile"),{
name:S.profile.name,
email:S.profile.email,
phone:S.profile.phone,
city:S.profile.city,
role:S.role,
plan:S.plan,
updatedAt:Date.now()
});
return true;
}catch(error){
console.error(error);
return false;
}
}
/* =========================================================
   CONTACTOS EN FIREBASE
========================================================= */

async function saveCloudContacts(){
if(!firebaseReady()){
return false;
}
try{
const uid=auth.currentUser.uid;
await set(ref(db,"users/"+uid+"/contacts"),S.contacts);
return true;
}catch(error){
console.error(error);
return false;
}
}

async function loadCloudContacts(){
if(!firebaseReady()){
return;
}
try{
const uid=auth.currentUser.uid;
const snapshot=await get(ref(db,"users/"+uid+"/contacts"));
if(snapshot.exists()){
S.contacts=snapshot.val()||[];
}
save();
}catch(error){
console.error(error);
}
}

/* =========================================================
   MENSAJES CLOUD
========================================================= */

let messagesListenerStarted=false;

function emailKey(email){
return btoa(String(email).toLowerCase().trim())
.replace(/=/g,"")
.replace(/\//g,"_")
.replace(/\+/g,"-");
}

async function sendCloudMessage(contact,text){
if(!firebaseReady()){
return false;
}
if(!contact || !contact.email){
toast("⚠️ La persona no tiene correo.");
return false;
}
try{
const senderUid=auth.currentUser.uid;
const key=emailKey(contact.email);
const messageRef=push(ref(db,"messageInbox/"+key));
await set(messageRef,{
senderUid,
senderName:S.profile.name,
senderEmail:S.profile.email,
recipientEmail:contact.email,
text,
date:time(),
timestamp:Date.now(),
read:false
});
return true;
}catch(error){
console.error(error);
toast("⚠️ No se pudo enviar el mensaje.");
return false;
}
}

function listenCloudMessages(){
if(!firebaseReady() || messagesListenerStarted){
return;
}
messagesListenerStarted=true;
const key=emailKey(auth.currentUser.email);
const inboxRef=ref(db,"messageInbox/"+key);

onValue(inboxRef,snapshot=>{
const data=snapshot.val()||{};
const incoming=Object.entries(data)
.map(([id,m])=>({id,...m,me:false}))
.sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));

const own=S.messages.filter(m=>m.me);
S.messages=[...own,...incoming];
save();
if(S.logged){
render();
}
});
}

/* =========================================================
   AUTENTICACIÓN
========================================================= */

if(auth){
onAuthStateChanged(auth,async user=>{
if(user){
S.logged=true;
S.user.uid=user.uid;
S.user.email=user.email||"";
if(!S.profile.email){
S.profile.email=user.email||"";
}
await loadCloudContacts();
listenCloudMessages();
save();
render();
}
});
}

/* =========================================================
   REGISTRO
========================================================= */

function register(){
modal("📝 Crear cuenta",`
<form onsubmit="create(event)">
<div class="fg">
<label>Nombre</label>
<input id="rname" required>
</div>
<div class="fg">
<label>Correo</label>
<input id="remail" type="email" required>
</div>
<div class="fg">
<label>Contraseña</label>
<input id="rpass" type="password" minlength="6" required>
</div>
<div class="fg">
<label>¿Para quién es?</label>
<button type="button" class="choice" onclick="role('elder',this)">
<span class="emoji">👵</span>
<b>Para mí</b><br>
<span class="muted">Soy la persona que utilizará SerCerca.</span>
</button>
<button type="button" class="choice" onclick="role('family',this)">
<span class="emoji">👨‍👩‍👧</span>
<b>Para mi familiar</b><br>
<span class="muted">Quiero acompañar a un familiar.</span>
</button>
</div>
<label>
<input id="terms" type="checkbox" required>
Acepto las condiciones.
</label>
<br><br>
<button class="btn primary block">Crear cuenta</button>
</form>
`);
}

function role(r,b){
S.role=r;
document.querySelectorAll(".choice").forEach(x=>x.classList.remove("selected"));
b.classList.add("selected");
}

async function create(e){
e.preventDefault();
if(!S.role){
toast("Selecciona una opción.");
return;
}
const name=document.getElementById("rname").value.trim();
const email=document.getElementById("remail").value.trim().toLowerCase();
const password=document.getElementById("rpass").value;

if(!auth){
toast("⚠️ Firebase no está configurado.");
return;
}

try{
const credential=await createUserWithEmailAndPassword(auth,email,password);
S.user={uid:credential.user.uid,name,email};
S.profile.name=name;
S.profile.email=email;
S.logged=true;
S.onboarding=true;
S.step=1;
S.page="home";
history("Cuenta creada",email);
await saveCloudProfile();
save();
close();
render();
toast("❤️ Cuenta creada.");
}catch(error){
toast(firebaseError(error));
}
}
/* =========================================================
   LOGIN & MODAL
========================================================= */

function login(){
modal("🔐 Iniciar sesión",`
<form onsubmit="enter(event)">
<div class="fg"><label>Correo</label><input id="lemail" type="email" required></div>
<div class="fg"><label>Contraseña</label><input id="lpass" type="password" required></div>
<button class="btn primary block">Entrar</button>
</form>
`);
}

async function enter(e){
e.preventDefault();
const email=document.getElementById("lemail").value.trim().toLowerCase();
const password=document.getElementById("lpass").value;

if(!auth){
toast("⚠️ Firebase no está configurado.");
return;
}

try{
const credential=await signInWithEmailAndPassword(auth,email,password);
S.logged=true;
S.user.uid=credential.user.uid;
S.user.email=email;
S.profile.email=email;
S.onboarding=false;
await loadCloudContacts();
listenCloudMessages();
save();
close();
render();
toast("❤️ Bienvenido de nuevo.");
}catch(error){
toast(firebaseError(error));
}
}

function modal(title,content){
document.body.insertAdjacentHTML("beforeend",`
<div class="modal" id="modal">
<div class="modal-box">
<div class="row between">
<h2>${title}</h2>
<button class="btn light" onclick="close()">✕</button>
</div>
<hr>
${content}
</div>
</div>
`);
}

function close(){
document.getElementById("modal")?.remove();
}

/* =========================================================
   ONBOARDING
========================================================= */

function onboarding(){
const steps=[
{
title:"🌷 Bienvenida",
text:"Vamos a preparar SerCerca paso a paso.",
content:`<div class="alert alert-ok"><b>❤️ Estar cerca sin quitar autonomía.</b><br><br>SerCerca te ayuda a mantener el contacto con las personas que tú elijas.</div>`
},
{
title:"👤 Tu perfil",
text:"Completa tus datos.",
content:`
<div class="fg"><label>Nombre</label><input id="pname" value="${esc(S.profile.name)}"></div>
<div class="fg"><label>Teléfono</label><input id="pphone" value="${esc(S.profile.phone)}"></div>
<div class="fg"><label>Ciudad</label><input id="pcity" value="${esc(S.profile.city)}"></div>
`
},
{
title:"❤️ Personas de confianza",

content:`
<div class="fg"><label>Nombre</label><input id="cname"></div>
<div class="fg"><label>Correo</label><input id="cemail" type="email"></div>

<select id="crelation">
<option>Hija/o</option><option>Nieta/o</option><option>Pareja</option><option>Hermana/o</option><option>Otro familiar</option>
</select></div>
`
},
{
title:"🔗 Vinculación",
text:"Puedes vincular a la persona.",
content: S.contacts.length ? S.contacts.map(c=>`
<div class="item">
<div class="row">
<div class="avatar">${initials(c.name)}</div>
<div><b>${esc(c.name)}</b><br><span class="muted">${esc(c.relation)}</span></div>
</div>
<button class="btn secondary" onclick="link(${c.id})">${c.linked ?"🔗 Vinculada":"Vincular"}</button>
</div>
`).join("") : `<div class="alert alert-warn">Todavía no has añadido ninguna persona. Puedes hacerlo después.</div>`
},
{

content:`
${setting("checkin","💚 Check-in","Permitir compartir check-ins")}
${setting("wellness","🌷 Bienestar","Permitir compartir estado")}
${setting("activity","🚶 Actividades","Permitir compartir actividades")}
`
},
{
title:"🎁 Prueba gratuita",
text:"Prueba las funciones avanzadas.",
content:`
<div class="alert alert-warn"><b>14 días gratis</b><br><br>Puedes probar las funciones avanzadas durante 14 días.</div>
<button class="btn secondary block" onclick="trial()">🎁 Activar prueba</button>
`
},
{

content:`

<div class="stat">🔐<b>Privacidad</b><span class="muted">Tú decides qué compartir.</span></div>

const x=steps[S.step-1];

return `
<main>
<div class="card" style="max-width:720px;margin:20px auto">
<div class="small">PASO ${S.step} DE ${steps.length}</div>
<div class="progress"><span style="width:${S.step/steps.length*100}%"></span></div>
<h1>${x.title}</h1>
<p class="muted">${x.text}</p>
${x.content}
<div class="actions">
<button class="btn light" onclick="backSetup()">← Atrás</button>
<button class="btn primary" onclick="nextSetup()">${S.step===steps.length ?"🚀 Entrar":"Continuar →"}</button>

function checkin(){
const total=QUESTIONS.length;
const index=S.wellness.questionIndex||0;
if(index>=total) return checkinSummary();

const q=QUESTIONS[index];
return `

<div class="small">CHECK-IN · ${index+1} DE ${total}</div>

<p class="muted">Pulsa una respuesta para continuar.</p>
${q.options.map(o=>`
<button class="choice" onclick="answer('${q.id}','${o[1].replace(/'/g,"\\'")}')">

<b>${o[1]}</b>
</button>
`).join("")}
<div class="actions">

function answer(id,value){
S.wellness.answers[id]=value;
if(id==="activity") S.wellness.activity=value;
S.wellness.questionIndex=(S.wellness.questionIndex||0)+1;
save();
render();
}

function previousQuestion(){
if((S.wellness.questionIndex||0)>0){
S.wellness.questionIndex--;
save();
render();

cancelCheckin();
}
}

function cancelCheckin(){
S.wellness.questionIndex=0;

}

const a=S.wellness.answers;

return `

function questionName(id){
const names={mood:"Estado de ánimo",sleep:"Sueño",food:"Alimentación",water:"Agua",pain:"Dolor",medicine:"Medicamentos",outside:"Salir de casa",social:"Contacto social",company:"Acompañamiento",need:"Necesidad",activity:"Actividad"};
return names[id]||id;
}

function getRecommendations(a){
const list=[];
if(a.activity==="Dar un paseo") list.push({icon:"🚶",title:"Un paseo puede ser un buen plan",text:"Si te apetece, puedes invitar a una amiga o familiar y dar un paseo juntos.",invite:true});
if(a.activity==="Cocinar algo") list.push({icon:"🍳",title:"¡Vamos a cocinar!",text:"Puedes preparar una receta que te guste y, si quieres, compartirla con alguien.",invite:false});
if(a.activity==="Cuidar mis plantas") list.push({icon:"🌱",title:"Un ratito con tus plantas",text:"Puedes regarlas, quitar hojas secas o preparar una nueva planta.",invite:false});
if(a.activity==="Dibujar o hacer manualidades") list.push({icon:"🎨",title:"Un momento creativo",text:"Busca algo que tengas por casa y crea algo que te guste.",invite:false});
if(a.activity==="Leer") list.push({icon:"📖",title:"Un rato de lectura",text:"Elige un libro, revista o historia que te apetece leer.",invite:false});
if(a.activity==="Escuchar música") list.push({icon:"🎵",title:"Pon tu música favorita",text:"Puedes escuchar algunas canciones que te hagan sentir bien.",invite:false});
if(a.activity==="Hablar con alguien") list.push({icon:"💌",title:"Una conversación puede alegrar el día",text:"Puedes escribir o llamar a una persona de confianza.",invite:true});
if(a.activity==="Ver a una amiga") list.push({icon:"👩‍🦰",title:"¡Un plan con una amiga!",text:"Puedes escribirle y preguntarle si quiere tomar algo o salir contigo.",invite:true});
if(a.activity==="Descansar") list.push({icon:"😴",title:"También está bien descansar",text:"Busca un lugar cómodo y tómate un momento tranquilo.",invite:false});
if(a.company==="Me siento solo/a") list.push({icon:"❤️",title:"Hoy podrías contactar con alguien",text:"Si te apetece, escribe a una persona de confianza y cuéntale cómo estás.",invite:true});

if(!list.length) list.push({icon:"🌷",title:"Haz algo que te guste",text:"Hoy puedes elegir una actividad sencilla que te haga sentir bien.",invite:false});
return list.slice(0,3);
}

notification(`💌 Has enviado un mensaje a ${contact.name}.`,"message");

<hr>
${p.features.map(f=>`<div class="plan-feature"><span class="check">✓</span>${f}</div>`).join("")}
<div class="plan-note">${p.name==="Básico" ?"Perfecto para empezar.":p.name==="Familia" ?"Más herramientas para acompañar a un familiar.":"El plan más completo de SerCerca."}</div>
<button class="btn ${S.plan===p.name ?"light":"primary"} block" onclick="choosePlan('${p.name}')">${S.plan===p.name ?"Plan actual":"Elegir plan"}</button>
</div>
`).join("")}
</div>
`;
}

async function choosePlan(plan){
const valid=PLANS.some(p=>p.name===plan);
if(!valid) return;
if(S.plan===plan){
toast("💳 Este ya es tu plan.");
return;
}
const previous=S.plan;
S.plan=plan;
history("Plan cambiado",`${previous} → ${plan}`);
save();
await saveCloudProfile();
render();
toast(`💳 Plan ${plan} seleccionado.`);
}

function settings(){
return `
<h1>⚙️ Configuración</h1>
<div class="grid g2">
<div class="card">
<h2>👤 Perfil</h2>
<div class="fg"><label>Nombre</label><input id="sname" value="${esc(S.profile.name)}"></div>
<div class="fg"><label>Teléfono</label><input id="sphone" value="${esc(S.profile.phone)}"></div>
<div class="fg"><label>Ciudad</label><input id="scity" value="${esc(S.profile.city)}"></div>
<button class="btn primary" onclick="saveProfile()">💾 Guardar</button>
</div>
<div class="card">
<h2>🔐 Privacidad</h2>
${privacySwitch("checkin","💚 Check-in","Compartir check-ins")}
${privacySwitch("wellness","🌷 Bienestar","Compartir estado")}
${privacySwitch("activity","🚶 Actividades","Compartir actividades")}
</div>
<div class="card">
<h2>🔔 Notificaciones</h2>
<div class="item">
<div><b>Avisos</b><br><span class="muted small">Mostrar notificaciones de SerCerca</span></div>
<button class="switch ${S.settings.notifications ?"on":""}" onclick="toggleNotifications()"></button>
</div>
</div>
<div class="card">
<h2>💳 Tu plan</h2>
<p><span class="pill">${esc(S.plan)}</span></p>
<button class="btn secondary" onclick="go('plans')">Ver planes</button>
</div>
</div>
`;
}

function privacySwitch(key,title,text){
return `
<div class="item">
<div><b>${title}</b><br><span class="muted small">${text}</span></div>
<button class="switch ${S.sharing[key] ?"on":""}" onclick="toggleShare('${key}')"></button>
</div>
`;
}

function setting(key,title,text){
return privacySwitch(key,title,text);
}

function toggleShare(key){
S.sharing[key]=!S.sharing[key];
save();
render();
}

function toggleNotifications(){
S.settings.notifications=!S.settings.notifications;
save();
render();
}

async function saveProfile(){
S.profile.name=document.getElementById("sname").value.trim();
S.profile.phone=document.getElementById("sphone").value.trim();
S.profile.city=document.getElementById("scity").value.trim();
S.user.name=S.profile.name;
history("Perfil actualizado",S.profile.name);
save();
await saveCloudProfile();
render();
toast("💾 Guardado.");
}

function trial(){
const start=new Date();
const end=new Date(start.getTime()+14*24*60*60*1000);
S.trial={active:true,start:start.toISOString(),end:end.toISOString()};
history("Prueba gratuita","14 días");
save();
toast("🎁 Prueba de 14 días activada.");
render();
}

async function logout(){
try{
if(auth) await signOut(auth);
}catch(error){
console.error(error);
}
S.logged=false;
S.onboarding=false;
S.page="home";
S.messages=[];
messagesListenerStarted=false;
save();
render();
}

function render(){
let html;
if(!S.logged){
html=welcome();
}else if(S.onboarding){
html=onboarding();
}else{
html=app();
}
document.getElementById("app").innerHTML=html;
}

render();

</script>
</body>
</html>
