<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#315c9b">
<title>SerCerca</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fb;
    color:#1d2939;
}

button,input,select,textarea{

}

button{

}

.hidden{

}

header{
    position:sticky;

}

.header{
    max-width:1150px;

    padding:10px 15px;

}

.logo{

    border-radius:14px;

}

.brand{

    font-weight:bold;

}

.nav{
    margin-left:auto;

    gap:6px;

.nav button{
    white-space:nowrap;
    border:0;

    color:#315c9b;
    padding:9px 11px;

    font-weight:bold;
}

main{

    padding:30px 16px 70px;
}

.hero{

    max-width:850px;
    margin:70px auto;
}

.hero h1{
    font-size:65px;

    margin:15px 0;
}

.hero p{
    color:#667085;

}

.card{
    background:white;

    border-radius:20px;
    padding:22px;

}

h1{
    margin:0 0 8px;
    font-size:34px;
}

h2{
    margin:0 0 9px;
}

h3{
    margin:0 0 7px;
}

.muted{
    color:#667085;
}

.small{
    font-size:13px;
}

.badge{
    display:inline-block;
    background:#eef4ff;
    color:#315c9b;
    padding:7px 12px;
    border-radius:99px;
    font-weight:bold;
    font-size:13px;
}

.btn{
    border:0;
    border-radius:12px;
    padding:13px 17px;
    font-weight:bold;
}

.primary{
    background:#315c9b;
    color:white;
}

.secondary{
    background:#eef4ff;
    color:#315c9b;
}

.light{
    background:white;
    border:1px solid #dfe5ee;
}

.success{
    background:#23865a;
    color:white;
}

.danger{
    background:#c43d3d;
    color:white;
}

.block{
    width:100%;
}

.actions{
    display:flex;
    gap:9px;
    flex-wrap:wrap;
    margin-top:16px;
}
.grid{
    display:grid;
    gap:16px;
}

.g2{
    grid-template-columns:repeat(2,minmax(0,1fr));
}

.g3{

}

}

    .g2,.g3,.g4{

    }

    .hero h1{

    }

    .nav button:nth-child(n+6){
        display:none;

.fg{
    margin-bottom:15px;
}

.fg label{
    display:block;
    font-weight:bold;
    margin-bottom:6px;
}

.fg input,

.fg textarea{

    border:1px solid #dfe5ee;

.fg textarea{

}

.progress{

    background:#e5eaf1;
    border-radius:99px;

}

.progress span{
    display:block;

}

.choice{

    border:2px solid #dfe5ee;

    margin:6px 0;

.choice:hover,
.choice.selected{
    border-color:#315c9b;
    background:#eef4ff;
}

.emoji{
    display:block;
    font-size:29px;
    margin-bottom:7px;
}

.row{
    display:flex;
    align-items:center;
    gap:12px;
}

.between{
    justify-content:space-between;
}

.wrap{
    flex-wrap:wrap;
}

.stat{
    background:white;
    border:1px solid #dfe5ee;
    border-radius:16px;
    padding:18px;
}

.stat b{
    display:block;
    font-size:25px;
    margin:5px 0;
}

.big{
    width:100%;
    border:0;
    border-radius:17px;
    padding:25px;
    font-size:21px;
    font-weight:bold;
}

.ok{
    background:#eaf8f0;
    color:#237b54;
}

.help{
    background:#fff0f0;
    color:#c43d3d;
}

.alert{
    padding:14px;
    border-radius:13px;
    margin:12px 0;
}

.alert-ok{
    background:#eaf8f0;
    color:#237b54;
}

.alert-warn{
    background:#fff8e5;
    color:#8a6419;
}

.alert-danger{
    background:#fff0f0;
    color:#a82e2e;
}

.item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    border:1px solid #dfe5ee;
    border-radius:13px;

}

.avatar{
    width:48px;
    height:48px;
    border-radius:50%;

    background:#eef4ff;
    color:#315c9b;

}

.pill{
    display:inline-block;
    padding:6px 10px;
    border-radius:99px;
    background:#eef4ff;
    color:#315c9b;
    font-weight:bold;
    font-size:12px;
}

.plan{
    position:relative;
}

.plan.current{
    border:2px solid #315c9b;
}

.price{
    font-size:35px;
    font-weight:bold;
    color:#315c9b;
}

.check{
    color:#23865a;
    font-weight:bold;
}

.chat{
    height:320px;
    overflow:auto;
    background:#f8fafc;
    border:1px solid #dfe5ee;
    border-radius:15px;
    padding:12px;
}

.msg{
    max-width:80%;
    padding:11px 13px;
    border-radius:15px;
    margin:7px 0;
}

.me{
    margin-left:auto;
    background:#315c9b;
    color:white;
}

.them{
    background:white;
    border:1px solid #dfe5ee;
}
.footer{
    text-align:center;
    color:#667085;
    font-size:13px;
    padding:25px;
}

.toast{
    position:fixed;
    right:15px;
    bottom:15px;
    background:#172033;
    color:white;
    padding:14px 17px;
    border-radius:12px;
    z-index:1000;
    max-width:330px;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:grid;
    place-items:center;
    padding:16px;
    z-index:500;
}

.modal-box{
    background:white;
    border-radius:20px;
    padding:22px;
    width:min(600px,100%);
    max-height:90vh;
    overflow:auto;
}

.switch{
    width:52px;
    height:29px;
    border:0;
    border-radius:99px;
    background:#cbd5e1;
    position:relative;
}

.switch:after{
    content:"";
    position:absolute;
    width:23px;
    height:23px;
    background:white;
    border-radius:50%;
    top:3px;
    left:3px;
    transition:.2s;
}

.switch.on{
    background:#315c9b;
}

.switch.on:after{
    left:26px;
}

hr{
    border:0;
    border-top:1px solid #e1e6ed;
    margin:22px 0;
}
</style>
</head>

<body>

<div id="app"></div>

<script>

/* =========================================================
   SER CERCA
   Aplicación completa en un solo archivo.
   Los datos se guardan en localStorage.
   ========================================================= */

const STORAGE_KEY="sercerca_completa_v1";

const DEFAULT_DATA={
    logged:false,
    onboarding:true,
    step:1,
    current:"home",

    user:{
        name:"",
        email:"",
        password:""
    },

    profile:{
        name:"",
        email:"",
        phone:"",
        city:"",
        birth:"",
        notes:""
    },

    role:"",

    contacts:[],

    messages:[],

    notifications:[],

    history:[],

    reminders:[],

    wellness:{
        status:"Sin registrar",
        last:""
    },

    plan:"Básico",

    trial:{
        active:false,
        start:"",
        end:""
    },

    settings:{
        notifications:true,
        weekly:true,
        activity:true,
        location:false,
        health:false
    }
};

let S=loadData();


function clone(obj){
    return JSON.parse(JSON.stringify(obj));
}


function loadData(){

    try{

        const saved=JSON.parse(
            localStorage.getItem(STORAGE_KEY)
        );

        if(!saved){
            return clone(DEFAULT_DATA);
        }

        const data=clone(DEFAULT_DATA);

        Object.keys(saved).forEach(key=>{

            if(
                saved[key] &&
                typeof saved[key]==="object" &&
                !Array.isArray(saved[key])
            ){

                data[key]={
                    ...data[key],
                    ...saved[key]
                };

            }else{

                data[key]=saved[key];

            }

        });

        return data;

    }catch(error){

        return clone(DEFAULT_DATA);

    }

}


function saveData(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(S)
    );

}
function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function now(){

    return new Date().toLocaleString(
        "es-ES",
        {
            dateStyle:"short",
            timeStyle:"short"
        }
    );

}


function initials(name){

    return (name || "?")
        .split(" ")
        .map(x=>x[0])
        .join("")
        .substring(0,2)
        .toUpperCase();

}


function toast(text){

    const element=document.createElement("div");

    element.className="toast";

    element.textContent=text;

    document.body.appendChild(element);

    setTimeout(()=>{
        element.remove();
    },2600);

}


function addHistory(action,detail=""){

    if(!S.settings.activity){
        return;
    }

    S.history.unshift({
        id:Date.now(),
        action:action,
        detail:detail,
        date:now()
    });

    S.history=S.history.slice(0,150);

}


function addNotification(text,type="info"){

    if(!S.settings.notifications){
        return;
    }

    S.notifications.unshift({
        id:Date.now(),
        text:text,
        type:type,
        date:now(),
        read:false
    });

    S.notifications=S.notifications.slice(0,100);

}


function go(page){

    S.current=page;

    saveData();

    render();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================================================
   PLANES
   ========================================================= */

function planLevel(){

    return {
        "Básico":1,
        "Familia":2,
        "Cerca":3
    }[S.plan] || 1;

}


function hasPlan(level){

    return planLevel()>=level || S.trial.active;

}


function lockedMessage(plan){

    return `
        <div class="alert alert-warn">

            <b>🔒 Función bloqueada</b>

            <br><br>

            Esta función está incluida desde el
            plan <b>${plan}</b>.

            <div class="actions">

                <button
                    class="btn primary"
                    onclick="go('plans')"
                >
                    💳 Ver planes
                </button>

            </div>

        </div>
    `;

}


/* =========================================================
   RENDER PRINCIPAL
   ========================================================= */

function render(){

    let html="";

    if(!S.logged){

        html=welcomeScreen();

    }else if(S.onboarding){

        html=onboardingScreen();

    }else{

        html=applicationLayout(
            applicationRouter()
        );

    }

    document.getElementById("app").innerHTML=html;

}


/* =========================================================
   BIENVENIDA
   ========================================================= */

function welcomeScreen(){

    return `

        <main>

            <section class="hero">

                <span class="badge">
                    🌷 Tranquilidad y acompañamiento
                </span>

                <h1>SerCerca</h1>

                <p>
                    Una aplicación para mantener cerca
                    a las personas mayores y sus familias,
                    respetando siempre su autonomía.
                </p>

                <div
                    class="actions"
                    style="justify-content:center"
                >

                    <button
                        class="btn primary"
                        onclick="startRegister()"
                    >
                        📝 Crear cuenta
                    </button>

                    <button
                        class="btn light"
                        onclick="startLogin()"
                    >
                        🔐 Iniciar sesión
                    </button>

                </div>
                <div
                    class="grid g3"
                    style="margin-top:45px;text-align:left"
                >

                    <div class="card">

                        <h3>❤️ Cercanía</h3>

                        <p class="muted">
                            Mantén el contacto con
                            las personas importantes.
                        </p>

                    </div>

                    <div class="card">

                        <h3>💚 Bienestar</h3>

                        <p class="muted">
                            Un check-in sencillo para
                            saber cómo estás.
                        </p>

                    </div>

                    <div class="card">

                        <h3>🔔 Tranquilidad</h3>

                        <p class="muted">
                            Avisos cuando algo
                            necesita atención.
                        </p>

                    </div>

                </div>

                <div class="footer">
                    SerCerca busca acompañar sin sustituir
                    servicios de emergencia ni atención profesional.
                </div>

            </section>

        </main>

    `;

}


/* =========================================================
   MODALES
   ========================================================= */

function openModal(title,content){

    const html=`

        <div class="modal" id="modal">

            <div class="modal-box">

                <div class="row between">

                    <h2>${title}</h2>

                    <button
                        class="btn light"
                        onclick="closeModal()"
                    >
                        ✕
                    </button>

                </div>

                <hr>

                ${content}

            </div>

        </div>

    `;

    document.body.insertAdjacentHTML(
        "beforeend",
        html
    );

}


function closeModal(){

    const modal=document.getElementById("modal");

    if(modal){
        modal.remove();
    }

}


/* =========================================================
   REGISTRO
   ========================================================= */

function startRegister(){

    openModal(
        "📝 Crear cuenta",
        `

        <form onsubmit="createAccount(event)">

            <div class="fg">

                <label>Nombre</label>

                <input
                    id="registerName"
                    required
                    placeholder="Tu nombre"
                >

            </div>

            <div class="fg">

                <label>Correo electrónico</label>

                <input
                    id="registerEmail"
                    type="email"
                    required
                    placeholder="correo@ejemplo.com"
                >

            </div>

            <div class="fg">

                <label>Contraseña</label>

                <input
                    id="registerPassword"
                    type="password"
                    minlength="6"
                    required
                    placeholder="Mínimo 6 caracteres"
                >

            </div>

            <div class="fg">

                <label>
                    ¿Para quién es SerCerca?
                </label>

                <button
                    type="button"
                    class="choice"
                    onclick="chooseRole('elder',this)"
                >
                    <span class="emoji">👵</span>
                    <b>Para mí</b>
                    <br>
                    <span class="muted small">
                        Soy la persona que utilizará SerCerca.
                    </span>
                </button>

                <button
                    type="button"
                    class="choice"
                    onclick="chooseRole('family',this)"
                >
                    <span class="emoji">👨‍👩‍👧</span>
                    <b>Para mi familiar</b>
                    <br>
                    <span class="muted small">
                        Quiero acompañar a un familiar.
                    </span>
                </button>

            </div>

            <label class="small">

                <input
                    id="terms"
                    type="checkbox"
                    required
                >

                Acepto las condiciones del prototipo.

            </label>

            <div class="actions">

                <button
                    class="btn primary block"
                    type="submit"
                >
                    Crear cuenta
                </button>

            </div>

        </form>

        `
    );

}
function chooseRole(role,button){

    S.role=role;

    document
        .querySelectorAll(".choice")
        .forEach(x=>x.classList.remove("selected"));

    button.classList.add("selected");

}


function createAccount(event){

    event.preventDefault();

    if(!S.role){

        toast("Primero selecciona para quién es SerCerca.");

        return;

    }

    S.user={
        name:document.getElementById("registerName").value.trim(),
        email:document.getElementById("registerEmail").value.trim(),
        password:document.getElementById("registerPassword").value
    };

    S.profile.name=S.user.name;
    S.profile.email=S.user.email;

    S.logged=true;
    S.onboarding=true;
    S.step=1;

    closeModal();

    saveData();

    render();

}


/* =========================================================
   LOGIN
   ========================================================= */

function startLogin(){

    openModal(
        "🔐 Iniciar sesión",
        `

        <form onsubmit="loginAccount(event)">

            <div class="fg">

                <label>Correo</label>

                <input
                    id="loginEmail"
                    type="email"
                    required
                >

            </div>

            <div class="fg">

                <label>Contraseña</label>

                <input
                    id="loginPassword"
                    type="password"
                    required
                >

            </div>

            <button class="btn primary block">
                Entrar
            </button>

            <p class="small muted">
                Esta versión guarda los datos localmente
                en este navegador.
            </p>

        </form>

        `
    );

}


function loginAccount(event){

    event.preventDefault();

    const email=document.getElementById("loginEmail").value;
    const password=document.getElementById("loginPassword").value;

    if(
        S.user.email &&
        (
            email!==S.user.email ||
            password!==S.user.password
        )
    ){

        toast("El correo o la contraseña no coinciden.");

        return;

    }

    S.logged=true;

    if(!S.profile.name){
        S.profile.name="Usuario";
    }

    S.onboarding=false;

    closeModal();

    saveData();

    render();

}


/* =========================================================
   CONFIGURACIÓN INICIAL
   ========================================================= */

function onboardingScreen(){

    const steps=[

        {
            title:"🌷 Bienvenida",
            text:"Bienvenido a SerCerca. Vamos a preparar tu cuenta paso a paso.",
            content:`

                <div class="alert alert-ok">

                    <b>❤️ Nuestra idea</b>

                    <br><br>

                    Tranquilidad y acompañamiento
                    manteniendo la autonomía.

                </div>

                <p class="muted">
                    Solo tienes que pulsar
                    <b>Continuar</b> y pasarás a la
                    siguiente pantalla.
                </p>

            `
        },

        {
            title:"👤 Completa tu perfil",
            text:"Esta información te ayudará a personalizar SerCerca.",
            content:`

                <div class="fg">

                    <label>Nombre</label>

                    <input
                        id="profileName"
                        value="${escapeHTML(S.profile.name)}"
                    >

                </div>

                <div class="fg">

                    <label>Teléfono</label>

                    <input
                        id="profilePhone"
                        value="${escapeHTML(S.profile.phone)}"
                        placeholder="Opcional"
                    >

                </div>

                <div class="fg">

                    <label>Ciudad</label>

                    <input
                        id="profileCity"
                        value="${escapeHTML(S.profile.city)}"
                        placeholder="Opcional"
                    >

                </div>

            `
        },
        {
            title:"❤️ Añade una persona de confianza",
            text:"Puedes añadir familiares o personas que quieras tener cerca.",
            content:`

                <div class="fg">

                    <label>Nombre</label>

                    <input
                        id="contactName"
                        placeholder="Ej. María"
                    >

                </div>

                <div class="fg">

                    <label>Correo</label>

                    <input
                        id="contactEmail"
                        type="email"
                        placeholder="Ej. maria@email.com"
                    >

                </div>

                <div class="fg">

                    <label>Relación</label>

                    <select id="contactRelation">

                        <option>Hija/o</option>
                        <option>Nieta/o</option>
                        <option>Pareja</option>
                        <option>Hermana/o</option>
                        <option>Otro familiar</option>
                        <option>Cuidador/a</option>

                    </select>

                </div>

            `
        },

        {
            title:"🔗 Vinculación",
            text:"Ahora puedes vincular la persona de confianza.",
            content:`

                ${
                    S.contacts.length
                    ?
                    S.contacts.map(c=>`

                        <div class="item">

                            <div class="row">

                                <div class="avatar">
                                    ${initials(c.name)}
                                </div>

                                <div>

                                    <b>${escapeHTML(c.name)}</b>

                                    <br>

                                    <span class="muted">
                                        ${escapeHTML(c.relation)}
                                    </span>

                                </div>

                            </div>

                            <button
                                class="btn ${c.linked?"success":"secondary"}"
                                onclick="toggleContactLink(${c.id})"
                            >
                                ${c.linked?"🔗 Vinculada":"Vincular"}
                            </button>

                        </div>

                    `).join("")
                    :
                    `
                        <div class="alert alert-warn">
                            Todavía no has añadido ninguna persona.
                            Puedes hacerlo después.
                        </div>
                    `
                }

            `
        },

        {
            title:"🔐 Privacidad y permisos",
            text:"Tú decides qué información comparte SerCerca.",
            content:`

                ${settingHTML(
                    "notifications",
                    "🔔 Avisos",
                    "Permitir avisos"
                )}

                ${settingHTML(
                    "activity",
                    "📋 Historial",
                    "Guardar actividad"
                )}

                ${settingHTML(
                    "location",
                    "📍 Ubicación",
                    "Desactivada por defecto"
                )}

            `
        },

        {
            title:"🎁 Prueba gratuita",
            text:"Activa tus 14 días de prueba.",
            content:`

                <div class="alert alert-warn">

                    <b>🎁 14 días gratis</b>

                    <br><br>

                    Durante la prueba podrás probar
                    las funciones avanzadas de SerCerca.

                </div>

                <button
                    class="btn secondary block"
                    onclick="activateTrial()"
                >
                    🎁 Activar prueba gratuita
                </button>

            `
        },

        {
            title:"✅ Todo preparado",
            text:"Ya puedes entrar en SerCerca.",
            content:`

                <div class="grid g3">

                    <div class="stat">
                        ❤️
                        <b>Confianza</b>
                        <span class="muted">
                            Tu red de personas.
                        </span>
                    </div>

                    <div class="stat">
                        💚
                        <b>Bienestar</b>
                        <span class="muted">
                            Tu check-in.
                        </span>
                    </div>

                    <div class="stat">
                        🔔
                        <b>Avisos</b>
                        <span class="muted">
                            Información importante.
                        </span>
                    </div>

                </div>

            `
        }

    ];

    const step=steps[S.step-1];

    return `

        <main>

            <div
                class="card"
                style="max-width:700px;margin:20px auto"
            >

                <div class="small">
                    PASO ${S.step} DE ${steps.length}
                </div>

                <div class="progress">

                    <span
                        style="
                        width:${S.step/steps.length*100}%
                        "
                    ></span>

                </div>

                <h1>${step.title}</h1>

                <p class="muted">
                    ${step.text}
                </p>

                ${step.content}

                <div class="actions">

                    <button
                        class="btn light"
                        onclick="previousSetup()"
                        ${S.step===1?"disabled":""}
                    >
                        ← Atrás
                    </button>

                    <button
                        class="btn primary"
                        onclick="nextSetup()"
                    >
                        ${S.step===steps.length
                            ?"🚀 Entrar en SerCerca"
                            :"Continuar →"}
                    </button>

                </div>

            </div>

        </main>

    `;

}
function nextSetup(){

    if(S.step===2){

        const name=document.getElementById("profileName");

        const phone=document.getElementById("profilePhone");

        const city=document.getElementById("profileCity");

        if(name){
            S.profile.name=name.value.trim() || S.profile.name;
        }

        if(phone){
            S.profile.phone=phone.value.trim();
        }

        if(city){
            S.profile.city=city.value.trim();
        }

        S.user.name=S.profile.name;

        addHistory(
            "Perfil completado",
            S.profile.name
        );

    }


    if(S.step===3){

        const name=document.getElementById("contactName");

        if(name && name.value.trim()){

            const contact={
                id:Date.now(),
                name:name.value.trim(),
                email:document.getElementById("contactEmail").value.trim(),
                relation:document.getElementById("contactRelation").value,
                linked:false
            };

            S.contacts.push(contact);

            addHistory(
                "Persona de confianza añadida",
                contact.name
            );

        }

    }


    if(S.step===6){

        if(!S.trial.active){

            activateTrial(false);

        }

    }


    if(S.step===7){

        S.onboarding=false;
        S.current="home";

        addHistory(
            "Configuración inicial terminada",
            "Entrada en SerCerca"
        );

        saveData();

        render();

        toast("¡Bienvenido a SerCerca!");

        return;

    }


    S.step++;

    saveData();

    render();

}


function previousSetup(){

    if(S.step>1){

        S.step--;

        saveData();

        render();

    }

}

        addNotification(
            `🌷 Estado actualizado: ${status}`,

    saveData();

    render();

    toast("Estado actualizado.");

function checkin(){

function createContact(event){

    event.preventDefault();

    const contact={

        id:Date.now(),

        name:document.getElementById(
            "newContactName"
        ).value.trim(),

        email:document.getElementById(
            "newContactEmail"
        ).value.trim(),

        relation:document.getElementById(
            "newContactRelation"
        ).value,

        linked:false

    };

    S.contacts.push(contact);

    addHistory(
        "Persona de confianza añadida",
        contact.name
    );

    closeModal();

    saveData();

    render();

    toast("❤️ Persona añadida.");

}


function toggleContactLink(id){

    const contact=S.contacts.find(
        c=>c.id===id
    );

    if(!contact)return;

    contact.linked=!contact.linked;

    addHistory(
        contact.linked
        ?"Persona vinculada"
        :"Persona desvinculada",
        contact.name
    );

    if(contact.linked){

        addNotification(
            `🔗 ${contact.name} ha sido vinculada.`,
            "link"
        );

    }

    saveData();

    render();

    toast(
        contact.linked
        ?"🔗 Persona vinculada."
        :"Persona desvinculada."
    );

}


function deleteContact(id){

    if(!confirm("¿Eliminar esta persona?")){
        return;
    }

    const contact=S.contacts.find(
        c=>c.id===id
    );

    S.contacts=S.contacts.filter(
        c=>c.id!==id
    );

    addHistory(
        "Persona eliminada",
        contact?.name || ""
    );

    saveData();

    render();

}

/* =========================================================
   PRUEBA 14 DÍAS
   ========================================================= */

function activateTrial(showToast=true){

    if(S.trial.active){

        if(showToast){
            toast("La prueba ya está activa.");
        }

        return;

    }

    const start=new Date();

    const end=new Date(
        start.getTime()+14*24*60*60*1000
    );

    S.trial={
        active:true,
        start:start.toISOString(),
        end:end.toISOString()
    };

    addHistory(
        "Prueba gratuita iniciada",
        "14 días"
    );

    saveData();

    render();

    if(showToast){
        toast("🎁 Prueba de 14 días activada.");
    }

}
function trialInformation(){

    const end=new Date(S.trial.end);

    const days=Math.max(
        0,
        Math.ceil(
            (end.getTime()-Date.now())/
            (24*60*60*1000)
        )
    );

    return `

        <div class="alert alert-ok">

            🎁 <b>Prueba gratuita activa</b>

            <br><br>

            Quedan aproximadamente
            <b>${days} día(s)</b>.

            <br>

            Finaliza el
            <b>${end.toLocaleDateString("es-ES")}</b>.

        </div>

    `;

}

function addReminderModal(){

    openModal(
        "📅 Nuevo recordatorio",
        `

        <form onsubmit="createReminder(event)">

            <div class="fg">

                <label>Nombre</label>

                <input
                    id="reminderTitle"
                    required
                    placeholder="Ej. Llamar a María"
                >

            </div>


            <div class="fg">

                <label>Fecha y hora</label>

                <input
                    id="reminderDate"
                    type="datetime-local"
                    required
                >

            </div>


            <button class="btn primary block">
                Guardar
            </button>

        </form>

        `
    );

}


function createReminder(event){

    event.preventDefault();

    const reminder={

        id:Date.now(),

        title:document.getElementById(
            "reminderTitle"
        ).value,

        date:new Date(
            document.getElementById(
                "reminderDate"
            ).value
        ).toLocaleString("es-ES")

    };

    S.reminders.push(reminder);

    addHistory(
        "Recordatorio creado",
        reminder.title
    );

    closeModal();

    saveData();

    render();

    toast("📅 Recordatorio guardado.");

}


function deleteReminder(id){

    S.reminders=S.reminders.filter(
        r=>r.id!==id
    );

    saveData();

    render();

}


/* =========================================================
   EXPORTAR / RESTABLECER
   ========================================================= */

function exportData(){

    const file=new Blob(
        [
            JSON.stringify(S,null,2)
        ],
        {
            type:"application/json"
        }
    );

    const url=URL.createObjectURL(file);

    const a=document.createElement("a");

    a.href=url;

    a.download="sercerca-datos.json";

    a.click();

    URL.revokeObjectURL(url);

}


function resetApplication(){

    if(!confirm(
        "¿Seguro que quieres borrar todos los datos de SerCerca?"
    )){
        return;
    }

    localStorage.removeItem(
        STORAGE_KEY
    );

    S=clone(DEFAULT_DATA);

    render();

}

function logout(){

    S.logged=false;

}
