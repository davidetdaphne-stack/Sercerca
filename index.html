<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#315c9b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>SerCerca</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
  overflow-x:hidden;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
  -webkit-user-select:none;
  user-select:none;
  touch-action:manipulation;
  -webkit-touch-callout:none;
}

button:active{
  transform:scale(.98);
}

.hidden{
  display:none!important;
}

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:white;
  border-bottom:1px solid #dfe5ee;
}

.header{
  max-width:1150px;
  margin:auto;
  padding:10px 15px;
  display:flex;
  align-items:center;
  gap:12px;
  min-height:64px;
}

.logo{
  width:43px;
  height:43px;
  min-width:43px;
  border-radius:14px;
  background:#315c9b;
  color:white;
  display:grid;
  place-items:center;
  font-size:23px;
  font-weight:bold;
}

.brand{
  font-weight:bold;
  font-size:21px;
  color:#315c9b;
  white-space:nowrap;
}

.nav{
  margin-left:auto;
  display:flex;
  gap:6px;
  overflow-x:auto;
  overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  max-width:100%;
  padding:3px;
}

.nav::-webkit-scrollbar{
  display:none;
}

.nav button{
  white-space:nowrap;
  border:0;
  background:#eef4ff;
  color:#315c9b;
  padding:11px 13px;
  min-height:44px;
  border-radius:10px;
  font-weight:bold;
}

.nav button:hover{
  background:#dce9ff;
}

.logout{
  min-height:44px;
  white-space:nowrap;
}

main{
  max-width:1150px;
  margin:auto;
  padding:30px 16px 70px;
}

.hero{
  max-width:850px;
  margin:70px auto;
  text-align:center;
}

.hero h1{
  font-size:65px;
  color:#315c9b;
  margin:15px 0;
}

.hero p{
  font-size:20px;
  line-height:1.55;
  color:#667085;
}

.card{
  background:white;
  border:1px solid #dfe5ee;
  border-radius:20px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 8px 25px rgba(25,48,80,.06);
}

h1{
  font-size:34px;
  margin:0 0 8px;
}

h2{
  margin:0 0 9px;
}

h3{
  margin:0 0 7px;
}

.muted{
  color:#667085;
}

.small{
  font-size:13px;
}

.badge{
  display:inline-block;
  background:#eef4ff;
  color:#315c9b;
  padding:7px 12px;
  border-radius:99px;
  font-weight:bold;
  font-size:13px;
}

.btn{
  border:0;
  border-radius:12px;
  padding:13px 17px;
  min-height:46px;
  font-weight:bold;
  touch-action:manipulation;
}
.primary{
  background:#315c9b;
  color:white;
}

.secondary{
  background:#eef4ff;
  color:#315c9b;
}

.light{
  background:white;
  border:1px solid #dfe5ee;
  color:#172033;
}

.success{
  background:#23865a;
  color:white;
}

.danger{
  background:#c43d3d;
  color:white;
}

.block{
  width:100%;
}

.actions{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-top:16px;
}

.grid{
  display:grid;
  gap:16px;
}

.g2{
  grid-template-columns:repeat(2,minmax(0,1fr));
}

.g3{
  grid-template-columns:repeat(3,minmax(0,1fr));
}

.g4{
  grid-template-columns:repeat(4,minmax(0,1fr));
}

.fg{
  margin-bottom:15px;
}

.fg label{
  display:block;
  font-weight:bold;
  margin-bottom:6px;
}

.fg input,
.fg select,
.fg textarea{
  width:100%;
  padding:13px;
  min-height:46px;
  border:1px solid #dfe5ee;
  border-radius:11px;
  background:white;
  outline:none;
}

.fg input:focus,
.fg select:focus,
.fg textarea:focus{
  border-color:#315c9b;
  box-shadow:0 0 0 3px rgba(49,92,155,.12);
}

.fg textarea{
  min-height:110px;
  resize:vertical;
}

.progress{
  height:8px;
  background:#e5eaf1;
  border-radius:99px;
  overflow:hidden;
  margin:15px 0 25px;
}

.progress span{
  display:block;
  height:100%;
  background:#315c9b;
  transition:.25s;
}

.choice{
  width:100%;
  text-align:left;
  border:2px solid #dfe5ee;
  background:white;
  color:#172033;
  border-radius:16px;
  padding:18px;
  margin:6px 0;
  min-height:70px;
  touch-action:manipulation;
}

.choice:hover,
.choice.selected{
  border-color:#315c9b;
  background:#eef4ff;
}

.emoji{
  display:block;
  font-size:30px;
  margin-bottom:7px;
}

.row{
  display:flex;
  align-items:center;
  gap:12px;
}

.between{
  justify-content:space-between;
}

.wrap{
  flex-wrap:wrap;
}

.stat{
  background:white;
  border:1px solid #dfe5ee;
  border-radius:16px;
  padding:18px;
}

.stat b{
  display:block;
  font-size:25px;
  margin:5px 0;
}

.big{
  width:100%;
  border:0;
  border-radius:17px;
  padding:25px;
  min-height:80px;
  font-size:21px;
  font-weight:bold;
  touch-action:manipulation;
}

.ok{
  background:#eaf8f0;
  color:#237b54;
}

.help{
  background:#fff0f0;
  color:#c43d3d;
}

.alert{
  padding:14px;
  border-radius:13px;
  margin:12px 0;
}

.alert-ok{
  background:#eaf8f0;
  color:#237b54;
}

.alert-warn{
  background:#fff8e5;
  color:#8a6419;
}

.alert-danger{
  background:#fff0f0;
  color:#a82e2e;
}

.item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  border:1px solid #dfe5ee;
  border-radius:13px;
  padding:13px;
  margin:9px 0;
  background:white;
}

.avatar{
  width:48px;
  height:48px;
  min-width:48px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#eef4ff;
  color:#315c9b;
  font-weight:bold;
}

.pill{
  display:inline-block;
  padding:6px 10px;
  border-radius:99px;
  background:#eef4ff;
  color:#315c9b;
  font-weight:bold;
  font-size:12px;
}
.plan.current{
  border:2px solid #315c9b;
}

.price{
  font-size:35px;
  font-weight:bold;
  color:#315c9b;
}

.check{
  color:#23865a;
  font-weight:bold;
}

.chat{
  height:320px;
  overflow:auto;
  background:#f8fafc;
  border:1px solid #dfe5ee;
  border-radius:15px;
  padding:12px;
  margin-top:15px;
}

.msg{
  max-width:80%;
  padding:11px 13px;
  border-radius:15px;
  margin:7px 0;
  overflow-wrap:anywhere;
}

.me{
  margin-left:auto;
  background:#315c9b;
  color:white;
}

.them{
  background:white;
  border:1px solid #dfe5ee;
}

.footer{
  text-align:center;
  color:#667085;
  font-size:13px;
  padding:25px;
}

.toast{
  position:fixed;
  right:15px;
  bottom:15px;
  background:#172033;
  color:white;
  padding:14px 17px;
  border-radius:12px;
  z-index:5000;
  max-width:330px;
  box-shadow:0 8px 25px rgba(0,0,0,.2);
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:grid;
  place-items:center;
  padding:16px;
  z-index:4000;
}

.modal-box{
  background:white;
  border-radius:20px;
  padding:22px;
  width:min(600px,100%);
  max-height:90vh;
  overflow:auto;
}

.switch{
  width:52px;
  height:29px;
  border:0;
  border-radius:99px;
  background:#cbd5e1;
  position:relative;
  min-width:52px;
}

.switch:after{
  content:"";
  position:absolute;
  width:23px;
  height:23px;
  background:white;
  border-radius:50%;
  top:3px;
  left:3px;
  transition:.2s;
}

.switch.on{
  background:#315c9b;
}

.switch.on:after{
  left:26px;
}

hr{
  border:0;
  border-top:1px solid #e1e6ed;
  margin:22px 0;
}

.notice{
  border-left:4px solid #315c9b;
  background:#eef4ff;
  padding:14px;
  border-radius:10px;
  margin:10px 0;
}

.unread{
  border-left:4px solid #315c9b;
  background:#f5f9ff;
}

.empty{
  text-align:center;
  padding:55px 20px;
  color:#667085;
}

.error-box{
  max-width:650px;
  margin:60px auto;
}

@media(max-width:900px){

  .header{
    flex-wrap:wrap;
  }

  .nav{
    order:3;
    width:100%;
    margin-left:0;
  }

  .logout{
    margin-left:auto;
  }

}

@media(max-width:800px){

  .g2,
  .g3,
  .g4{
    grid-template-columns:1fr;
  }

  .hero{
    margin:40px auto;
  }

  .hero h1{
    font-size:48px;
  }

  main{
    padding:22px 12px 60px;
  }

  .card{
    padding:18px;
  }

  h1{
    font-size:29px;
  }

  .nav button{
    font-size:13px;
    padding:10px 12px;
  }

}

@media(max-width:480px){

  .brand{
    font-size:18px;
  }

  .logo{
    width:40px;
    height:40px;
    min-width:40px;
  }

  .logout{
    padding:10px 12px;
  }

  .actions .btn{
    flex:1 1 140px;
  }

  .hero h1{
    font-size:43px;
  }

}
</style>
</head>

<body>

<div id="app"></div>

<script>

/* =========================================================
   SER CERCA
   VERSIÓN COMPLETA Y PROTEGIDA
========================================================= */

"use strict";

const KEY="sercerca_v6";

/* =========================================================
   ESTADO INICIAL
========================================================= */

const DEFAULT={

  logged:false,

  onboarding:true,

  step:1,

  page:"home",

  user:{
    name:"",
    email:"",
    password:""
  },

  profile:{
    name:"",
    email:"",
    phone:"",
    city:"",
    notes:""
  },

  role:"user",

  contacts:[],

  notifications:[],

  messages:[],

  history:[],

  wellness:{
    answers:{},
    status:"",
    activity:"",
    last:"",
    questionIndex:0
  },
  sharing:{
    checkin:true,
    wellness:true,
    activity:true,
    messages:true
  },

  plan:"Básico",

  trial:{
    active:false,
    start:"",
    end:""
  },

  settings:{
    notifications:true,
    activity:true,
    location:false
  }

};

let S=load();

/* =========================================================
   UTILIDADES
========================================================= */

function copy(obj){

  return JSON.parse(
    JSON.stringify(obj)
  );

}

function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function time(){

  try{

    return new Date().toLocaleString(
      "es-ES",
      {
        dateStyle:"short",
        timeStyle:"short"
      }
    );

  }catch(e){

    return new Date().toLocaleString();

  }

}

function initials(name){

  const words=
    String(name||"")
      .trim()
      .split(/\s+/)
      .filter(Boolean);

  if(!words.length){
    return "SC";
  }

  return words
    .slice(0,2)
    .map(x=>x[0])
    .join("")
    .toUpperCase();

}

/* =========================================================
   CARGA SEGURA
========================================================= */

function load(){

  try{

    const raw=
      localStorage.getItem(KEY);

    if(!raw){

      return copy(DEFAULT);

    }

    const saved=
      JSON.parse(raw);

    return normalize(
      saved
    );

  }catch(error){

    console.warn(
      "No se pudieron cargar los datos:",
      error
    );

    return copy(DEFAULT);

  }

}

/* =========================================================
   NORMALIZACIÓN
========================================================= */

function normalize(data){

  const base=copy(DEFAULT);

  if(!data || typeof data!=="object"){
    return base;
  }

  const result={
    ...base,
    ...data
  };

  result.user={
    ...base.user,
    ...(data.user||{})
  };

  result.profile={
    ...base.profile,
    ...(data.profile||{})
  };

  result.wellness={
    ...base.wellness,
    ...(data.wellness||{})
  };

  result.wellness.answers={
    ...base.wellness.answers,
    ...((data.wellness&&data.wellness.answers)||{})
  };

  result.sharing={
    ...base.sharing,
    ...(data.sharing||{})
  };

  result.trial={
    ...base.trial,
    ...(data.trial||{})
  };

  result.settings={
    ...base.settings,
    ...(data.settings||{})
  };

  result.contacts=
    Array.isArray(data.contacts)
    ?data.contacts
    :[];

  result.notifications=
    Array.isArray(data.notifications)
    ?data.notifications
    :[];

  result.messages=
    Array.isArray(data.messages)
    ?data.messages
    :[];

  result.history=
    Array.isArray(data.history)
    ?data.history
    :[];

  if(!Number.isFinite(Number(result.step))){
    result.step=1;
  }

  result.step=
    Math.max(
      1,
      Math.min(
        7,
        Number(result.step)
      )
    );

  if(!result.page){
    result.page="home";
  }

  if(!result.plan){
    result.plan="Básico";
  }

  return result;

}
/* =========================================================
   GUARDADO SEGURO
========================================================= */

function save(){

  try{

    localStorage.setItem(
      KEY,
      JSON.stringify(S)
    );

    return true;

  }catch(error){

    console.error(
      "No se pudo guardar:",
      error
    );

    return false;

  }

}

/* =========================================================
   NAVEGACIÓN
========================================================= */

function go(page){

  const allowed=[

    "home",
    "checkin",
    "people",
    "messages",
    "family",
    "notifications",
    "history",
    "plans",
    "settings"

  ];

  if(!allowed.includes(page)){
    page="home";
  }

  S.page=page;

  save();

  render();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

/* =========================================================
   ROL
========================================================= */

function role(){

  return S.role||"user";

}

function setRole(value){

  const allowed=[
    "user",
    "family"
  ];

  S.role=
    allowed.includes(value)
    ?value
    :"user";

  save();

  render();

}

/* =========================================================
   TOAST
========================================================= */

let toastTimer=null;

function toast(message){

  const old=
    document.querySelector(".toast");

  if(old){
    old.remove();
  }

  const el=
    document.createElement("div");

  el.className="toast";

  el.textContent=message;

  document.body.appendChild(el);

  clearTimeout(toastTimer);

  toastTimer=
    setTimeout(()=>{
      el.remove();
    },3500);

}

/* =========================================================
   MODAL
========================================================= */

function modal(title,content){

  const old=
    document.getElementById("modal");

  if(old){
    old.remove();
  }

  const wrapper=
    document.createElement("div");

  wrapper.id="modal";

  wrapper.className="modal";

  wrapper.innerHTML=`

    <div
      class="modal-box"
      role="dialog"
      aria-modal="true">

      <div
        class="row between"
        style="margin-bottom:15px">

        <h2>${esc(title)}</h2>

        <button
          type="button"
          class="btn light"
          aria-label="Cerrar"
          onclick="close()">

          ✕

        </button>

      </div>

      ${content}

    </div>

  `;

  document.body.appendChild(wrapper);

}

function close(){

  const modalEl=
    document.getElementById("modal");

  if(modalEl){
    modalEl.remove();
  }

}

/* =========================================================
   HISTORIAL
========================================================= */

function addHistory(action,detail){

  if(!S.settings.activity){
    return;
  }

  S.history.unshift({

    id:Date.now()+Math.random(),

    action:String(action||""),

    detail:String(detail||""),

    date:time()

  });

  S.history=
    S.history.slice(0,100);

}

/* =========================================================
   AVISOS
========================================================= */

function addNotification(text,type,targetId){

  if(!S.settings.notifications){
    return;
  }

  S.notifications.unshift({

    id:Date.now()+Math.random(),

    text:String(text||""),

    type:type||"general",

    target:targetId||null,

    read:false,

    date:time()

  });

  S.notifications=
    S.notifications.slice(0,100);

}
function markNotificationsRead(){

  S.notifications.forEach(
    n=>{
      n.read=true;
    }
  );

  save();

}

/* =========================================================
   BIENVENIDA
========================================================= */

function welcome(){

  return `

    <main>

      <div class="hero">

        <div class="logo"
          style="margin:auto;width:70px;height:70px;font-size:35px">

          ♥
        </div>

        <h1>
          SerCerca
        </h1>

        <p>
          Estar cerca sin quitar autonomía.
        </p>

        <p>
          Una forma sencilla de mantener
          el contacto con las personas
          que tú eliges.
        </p>

        <div class="card">

          <h2>
            ❤️ Bienvenido/a
          </h2>

          <p class="muted">
            Vamos a preparar tu cuenta paso a paso.
          </p>

          <button
            type="button"
            class="btn primary block"
            onclick="startApp()">

            🚀 Empezar

          </button>

        </div>

        <div class="small muted">

          Tus datos de esta versión
          se guardan en este navegador.

        </div>

      </div>

    </main>

  `;

}

function startApp(){

  S.logged=true;

  S.onboarding=true;

  S.step=1;

  S.page="home";

  save();

  render();

}

/* =========================================================
   ONBOARDING
========================================================= */

function onboarding(){

  const steps=[

    {
      title:"🌷 Bienvenida",
      text:"Vamos a preparar SerCerca paso a paso.",
      content:`

        <div class="alert alert-ok">

          <b>
            ❤️ Estar cerca sin quitar autonomía.
          </b>

          <br><br>

          SerCerca te ayuda a mantener
          el contacto con las personas
          que tú elijas.

        </div>

      `
    },

    {
      title:"👤 Tu perfil",
      text:"Completa tus datos.",
      content:`

        <div class="fg">

          <label for="pname">
            Nombre
          </label>

          <input
            id="pname"
            autocomplete="name"
            value="${esc(S.profile.name)}">

        </div>

        <div class="fg">

          <label for="pphone">
            Teléfono
          </label>

          <input
            id="pphone"
            type="tel"
            autocomplete="tel"
            value="${esc(S.profile.phone)}">

        </div>

        <div class="fg">

          <label for="pcity">
            Ciudad
          </label>

          <input
            id="pcity"
            value="${esc(S.profile.city)}">

        </div>

      `
    },

    {
      title:"❤️ Personas de confianza",
      text:"Añade a las personas que quieres tener cerca.",
      content:`

        <div class="fg">

          <label for="cname">
            Nombre
          </label>

          <input
            id="cname">

        </div>

        <div class="fg">

          <label for="cemail">
            Correo
          </label>

          <input
            id="cemail"
            type="email">

        </div>

        <div class="fg">

          <label for="crelation">
            Relación
          </label>

          <select id="crelation">

            <option>Hija/o</option>
            <option>Nieta/o</option>
            <option>Pareja</option>
            <option>Hermana/o</option>
            <option>Otro familiar</option>

          </select>

        </div>

        <div class="small muted">

          Si no quieres añadirla ahora,
          puedes dejarlo vacío y continuar.

        </div>

      `
    },
    {
      title:"🔗 Vinculación",
      text:"Puedes vincular a la persona.",
      content:`

        ${
          S.contacts.length
          ?
          S.contacts.map(c=>`

            <div class="item">

              <div class="row">

                <div class="avatar">
                  ${initials(c.name)}
                </div>

                <div>

                  <b>${esc(c.name)}</b>

                  <br>

                  <span class="muted">
                    ${esc(c.relation)}
                  </span>

                </div>

              </div>

              <button
                type="button"
                class="btn secondary"

function nextSetup(){

  const step=
    Number(S.step)||1;

  if(step===2){

    const name=
      document.getElementById("pname")
      ?.value.trim()||"";

    const phone=
      document.getElementById("pphone")
      ?.value.trim()||"";

    const city=
      document.getElementById("pcity")
      ?.value.trim()||"";

    if(!name){

      toast("Escribe tu nombre.");

      return;

    }

    S.profile.name=name;

    S.user.name=name;

    S.profile.phone=phone;

    S.profile.city=city;

    save();

  }

  if(step===3){

    const name=
      document.getElementById("cname")
      ?.value.trim()||"";

    const email=
      document.getElementById("cemail")
      ?.value.trim()||"";

    const relation=
      document.getElementById("crelation")
      ?.value||"Otro familiar";

    if(name){

      const exists=
        S.contacts.some(
          c=>
            String(c.name)
              .toLowerCase()
            ===
            name.toLowerCase()
        );

      if(!exists){

        S.contacts.push({

          id:
            Date.now()+
            Math.random(),

          name,

          email,

          relation,

          linked:false

        });

        addHistory(
          "Persona añadida",
          name
        );

      }

    }

  }

  if(step===7){

    S.onboarding=false;

    S.page="home";

    addHistory(
      "Configuración inicial",
      "Completada"
    );

    save();

    render();

    toast(
      "❤️ Bienvenido/a a SerCerca."
    );

    return;

  }

  S.step=step+1;

  save();

  render();

}

function backSetup(){

  const step=
    Number(S.step)||1;

  if(step>1){

    S.step=step-1;

    save();

    render();

  }

}

function startCheckin() {
  S.wellness.questionIndex = 0;

  save();
  render();
}

function checkin() {
  const total = QUESTIONS.length;
  const index = Math.max(0, Number(S.wellness.questionIndex) || 0);

  if (index >= total) {
    return checkinSummary();
  }

  const q = QUESTIONS[index];

  return `
    <div class="card" style="max-width:750px;margin:auto">
      <div class="small">
        CHECK-IN · ${index + 1} DE ${total}
      </div>
      <div class="progress">
        <span style="width:${((index + 1) / total) * 100}%"></span>
      </div>
      <h1>${q.title}</h1>
      <p class="muted">Pulsa una respuesta para continuar.</p>
      ${q.options
        .map(
          (o) => `
        <button
          type="button"
          class="choice"
          onclick='answer(${JSON.stringify(q.id)},${JSON.stringify(o[1])})'>
          <span class="emoji">${o[0]}</span>
          <b>${esc(o[1])}</b>
        </button>
      `
        )
        .join("")}
      <div class="actions">
        <button type="button" class="btn light" onclick="previousQuestion()">

        </button>
        <button type="button" class="btn light" onclick="cancelCheckin()">

        </button>

}

function answer(id, value) {
  if (!id) return;

  if (!S.wellness.answers) {
    S.wellness.answers = {};
  }

  S.wellness.answers[id] = value;

  if (id === "activity") {
    S.wellness.activity = value;
  }

  S.wellness.questionIndex = Number(S.wellness.questionIndex || 0) + 1;
  save();
  render();
}

function previousQuestion() {
  const current = Number(S.wellness.questionIndex) || 0;

  if (current > 0) {
    S.wellness.questionIndex = current - 1;
    save();
    render();
  } else {
    cancelCheckin();
  }
}

function cancelCheckin() {
  S.wellness.questionIndex = 0;
  S.wellness.answers = {};
  S.wellness.activity = "";
  save();
  go("home");
}

    .join(" · ");

  contacts.forEach((c) => {
    addNotification(
      `💚 Nuevo check-in de ${S.profile.name || "SerCerca"}: ${summary}`,
      "checkin",
      c.id
    );
  });

  if (contacts.length) {
    addHistory(
      "Check-in compartido",
      contacts.map((c) => c.name).join(", ")
    );

}

function addContact(event) {
  event.preventDefault();

  const name = document.getElementById("newcname")?.value.trim() || "";
  const email = document.getElementById("newcemail")?.value.trim() || "";
  const relation = document.getElementById("newcrelation")?.value || "Otro familiar";

  if (!name) {
    toast("Escribe el nombre.");
    return;
  }

  if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    toast("El correo no parece válido.");
    return;
  }

  const exists = S.contacts.some(
    (c) => String(c.name).toLowerCase() === name.toLowerCase()
  );

  if (exists) {
    toast("Esa persona ya está añadida.");
    return;
  }

  const contact = {
    id: Date.now() + Math.random(),
    name,
    email,
    relation,
    linked: false
  };

  S.contacts.push(contact);
  addHistory("Persona añadida", contact.name);
  close();
  save();
  render();
  toast("❤️ Persona añadida.");
}

function linkContact(id) {
  const c = S.contacts.find((x) => String(x.id) === String(id));
  if (!c) return;

  c.linked = !c.linked;
  addHistory(c.linked ? "Persona vinculada" : "Persona desvinculada", c.name);
  save();
  render();
  toast(c.linked ? "🔗 Persona vinculada." : "🔗 Persona desvinculada.");
}

function removeContact(id) {
  const c = S.contacts.find((x) => String(x.id) === String(id));
  if (!c) return;

  modal(
    "Eliminar persona",
    `
    <p>¿Seguro que quieres eliminar a <b>${esc(c.name)}</b>?</p>
    <div class="actions">
      <button type="button" class="btn light" onclick="close()">Cancelar</button>
      <button type="button" class="btn danger" onclick="confirmRemoveContact(${JSON.stringify(id)})">
        🗑️ Eliminar
      </button>
    </div>
    `
  );
}

function confirmRemoveContact(id) {
  const c = S.contacts.find((x) => String(x.id) === String(id));
  S.contacts = S.contacts.filter((x) => String(x.id) !== String(id));

  if (c) {
    addHistory("Persona eliminada", c.name);
  }

  close();
  save();
  render();
  toast("Persona eliminada.");
}

  modal(

      <div class="fg">

            .join("")}

      </div>

      </div>

function sendMessage(event) {
  event.preventDefault();

  const contactId = document.getElementById("mto")?.value;
  const text = document.getElementById("mtext")?.value.trim() || "";
  const contact = S.contacts.find((c) => String(c.id) === String(contactId));

  if (!contact) {
    toast("Selecciona una persona.");
    return;
  }

  if (!text) {
    toast("Escribe un mensaje.");
    return;
  }

  const message = {
    id: Date.now() + Math.random(),
    me: true,
    to: contact.name,
    contactId: contact.id,
    text,
    date: time()
  };

  S.messages.push(message);

  if (S.sharing.messages) {
    addNotification(
      `💌 Has enviado un mensaje a ${contact.name}.`,
      "message",
      contact.id
    );
  }

  addHistory("Mensaje enviado", contact.name);
  close();
  save();
  render();
  toast("💌 Mensaje preparado.");
}

function privacySwitch(key, title, text) {
  return `
    <div class="item">
      <div>
        <b>${title}</b><br>
        <span class="muted small">${text}</span>
      </div>
      <button
        type="button"
        class="switch ${S.sharing[key] ? "on" : ""}"
        aria-label="${esc(title)}"
        aria-pressed="${S.sharing[key] ? "true" : "false"}"
        onclick="toggleShare('${key}')">
      </button>
    </div>
  `;
}

function setting(key, title, text) {
  return privacySwitch(key, title, text);
}

function generalSwitch(key, title, text) {
  return `
    <div class="item">
      <div>
        <b>${title}</b><br>
        <span class="muted small">${text}</span>
      </div>
      <button
        type="button"
        class="switch ${S.settings[key] ? "on" : ""}"
        aria-label="${esc(title)}"
        aria-pressed="${S.settings[key] ? "true" : "false"}"
        onclick="toggleSetting('${key}')">
      </button>
    </div>
  `;
}

function toggleShare(key) {
  if (!(key in S.sharing)) return;
  S.sharing[key] = !S.sharing[key];
  save();
  render();
}

function toggleSetting(key) {
  if (!(key in S.settings)) return;
  S.settings[key] = !S.settings[key];
  save();
  render();
}

function saveProfile() {
  const name = document.getElementById("sname")?.value.trim() || "";
  const email = document.getElementById("semail")?.value.trim().toLowerCase() || "";
  const phone = document.getElementById("sphone")?.value.trim() || "";
  const city = document.getElementById("scity")?.value.trim() || "";
  const notes = document.getElementById("snotes")?.value.trim() || "";

  if (!name) {
    toast("El nombre no puede estar vacío.");
    return;
  }

  if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    toast("El correo no parece válido.");
    return;
  }

  S.profile.name = name;
  S.profile.email = email;
  S.profile.phone = phone;
  S.profile.city = city;
  S.profile.notes = notes;
  S.user.name = name;
  S.user.email = email;

  addHistory("Perfil actualizado", name);
  save();
  render();
  toast("💾 Perfil guardado correctamente.");
}

/* =========================================================
   PRUEBA GRATUITA
========================================================= */

function trial() {
  const start = new Date();
  const end = new Date(start.getTime() + 14 * 24 * 60 * 60 * 1000);

  S.trial = {
    active: true,
    start: start.toISOString(),
    end: end.toISOString()
  };

  addHistory("Prueba gratuita", "14 días");
  save();
  render();
  toast("🎁 Prueba de 14 días activada.");
}

/* =========================================================
   INVITACIONES
========================================================= */

function inviteFromRecommendation() {
  const contacts = S.contacts.filter((c) => c.linked);

  if (!contacts.length) {
    modal(
      "❤️ Personas de confianza",
      `
      <div class="alert alert-warn">
        Primero vincula una persona de confianza.
      </div>
      <button type="button" class="btn primary block" onclick="close();go('people')">
        Añadir persona
      </button>
      `
    );
    return;
  }

  modal(
    "💌 Invitar a alguien",
    `
    <p>¿A quién quieres invitar?</p>
    ${contacts
      .map(
        (c) => `
      <button type="button" class="choice" onclick="sendInvitation(${JSON.stringify(c.id)})">
        <span class="emoji">❤️</span>
        <b>${esc(c.name)}</b><br>
        <span class="muted">${esc(c.relation)}</span>
      </button>
    `
      )
      .join("")}
    `
  );
}

function sendInvitation(id) {
  const c = S.contacts.find((x) => String(x.id) === String(id));
  if (!c) return;

  addNotification(
    `🌷 ${S.profile.name || "SerCerca"} te ha enviado una invitación.`,
    "invitation",
    c.id
  );

  addHistory("Invitación enviada", c.name);
  close();
  save();
  toast("💌 Invitación preparada para " + c.name + ".");
}

/* =========================================================
   LOGOUT
========================================================= */

function logout() {
  S.logged = false;
  save();
  render();
  toast("Has cerrado sesión.");
}

/* =========================================================
   REINICIO
========================================================= */

function resetAccount() {
  modal(
    "⚠️ Reiniciar SerCerca",
    `
    <p>Esto borrará los datos guardados en este navegador.</p>
    <div class="alert alert-danger">Esta acción no se puede deshacer.</div>
    <div class="actions">
      <button type="button" class="btn light" onclick="close()">Cancelar</button>
      <button type="button" class="btn danger" onclick="reallyReset()">🗑️ Borrar todo</button>
    </div>
    `
  );
}

function reallyReset() {
  try {
    localStorage.removeItem(KEY);
  } catch (error) {
    console.warn(error);
  }

  S = copy(DEFAULT);
  close();
  render();
  toast("SerCerca se ha reiniciado.");
}

/* =========================================================
   RENDER SEGURO
========================================================= */

function render() {
  const root = document.getElementById("app");
  if (!root) return;

  try {
    let html;
    if (!S.logged) {
      html = welcome();
    } else if (S.onboarding) {
      html = onboarding();
    } else {
      html = app();
    }
    root.innerHTML = html;
  } catch (error) {
    console.error("Error de renderizado:", error);
    showError(error);
  }
}

/* =========================================================
   PANTALLA DE ERROR
========================================================= */

function showError(error) {
  const root = document.getElementById("app");
  if (!root) return;

  root.innerHTML = `
    <main>
      <div class="card error-box">
        <div class="alert alert-danger">
          <h2>⚠️ No se ha podido cargar SerCerca</h2>
          <p>Ha ocurrido un problema inesperado al mostrar la aplicación.</p>
        </div>
        <button type="button" class="btn primary block" onclick="safeRecovery()">
          🔄 Intentar recuperar
        </button>
        <button type="button" class="btn light block" style="margin-top:10px" onclick="reallyReset()">
          🗑️ Reiniciar SerCerca
        </button>
        <details style="margin-top:15px">
          <summary>Información técnica</summary>
          <pre style="white-space:pre-wrap">${esc(error?.message || String(error))}</pre>
        </details>
      </div>
    </main>
  `;
}

/* =========================================================
   RECUPERACIÓN
========================================================= */

function safeRecovery() {
  try {
    S = normalize(S);
    if (!S.logged) {
      S.onboarding = true;
    }
    save();
    render();
  } catch (error) {
    showError(error);
  }
}

/* =========================================================
   ERRORES GLOBALES
========================================================= */

window.addEventListener("error", function (event) {
  console.error("Error global:", event.error || event.message);
});

window.addEventListener("unhandledrejection", function (event) {
  console.error("Promesa rechazada:", event.reason);
});

/* =========================================================
   INICIO
========================================================= */

render();
