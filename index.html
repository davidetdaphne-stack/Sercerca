
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6c63ff">
<title>SerCerca</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f6f7fb;
  color:#222;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

header{
  background:white;
  border-bottom:1px solid #e5e5e5;
  position:sticky;
  top:0;
  z-index:20;
}

.header{
  max-width:1200px;
  margin:auto;
  padding:12px 18px;
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:42px;
  height:42px;
  border-radius:14px;
  background:#6c63ff;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  flex-shrink:0;
}

.brand{
  font-size:21px;
  font-weight:bold;
}

.nav{
  display:flex;
  gap:5px;
  margin-left:auto;
  overflow:auto;
}

.nav button{
  border:0;
  background:white;
  padding:9px 10px;
  border-radius:10px;
  white-space:nowrap;
}

.nav button:hover{
  background:#f0efff;
}

main{
  max-width:1200px;
  margin:auto;
  padding:25px 18px 70px;
}

h1,h2,h3{
  margin-top:0;
}

.card{
  background:white;
  border-radius:20px;
  padding:22px;
  margin:16px 0;
  box-shadow:0 5px 25px rgba(0,0,0,.06);
}

.hero{
  max-width:720px;
  margin:50px auto;
  text-align:center;
}

.hero .logo{
  margin:auto;
  width:80px;
  height:80px;
  font-size:38px;
}

.grid{
  display:grid;
  gap:16px;
}

.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}

.row{
  display:flex;
  align-items:center;
  gap:12px;
}

.between{
  justify-content:space-between;
}

.wrap{
  flex-wrap:wrap;
}

.stat{
  background:white;
  border-radius:18px;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:7px;
  box-shadow:0 4px 20px rgba(0,0,0,.05);
}

.stat:first-letter{
  font-size:24px;
}

.stat b{
  font-size:20px;
}

.muted{
  color:#707070;
}

.small{
  font-size:13px;
}

.btn{
  border:0;
  border-radius:12px;
  padding:11px 16px;
  font-weight:bold;
}

.btn.primary{
  background:#6c63ff;
  color:white;
}

.btn.secondary{
  background:#eceaff;
  color:#5149d9;
}

.btn.light{
  background:#f0f1f5;
  color:#333;
}

.btn.danger{
  background:#e53935;
  color:white;
}

.btn.block{
  width:100%;
}

.big{
  border:0;
  border-radius:18px;
  padding:20px;
  width:100%;
  font-weight:bold;
  font-size:17px;
}
.big.ok{
  background:#e8f8ee;
  color:#15733a;
}

.big.help{
  background:#fff0f0;
  color:#c62828;
}

.fg{
  margin:14px 0;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:6px;
}

input,select,textarea{
  width:100%;
  border:1px solid #d9dbe2;
  border-radius:11px;
  padding:11px;
  background:white;
}

textarea{
  min-height:110px;
  resize:vertical;
}

.choice{
  width:100%;
  text-align:left;
  background:white;
  border:1px solid #dddfe7;
  border-radius:16px;
  padding:15px;
  margin:7px 0;
  transition:.15s;
}

.choice:hover{
  border-color:#6c63ff;
  background:#f8f7ff;
}

.emoji{
  font-size:25px;
  margin-right:8px;
}

.item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:15px 0;
  border-bottom:1px solid #eee;
}

.item:last-child{
  border-bottom:0;
}

.avatar{
  width:44px;
  height:44px;
  border-radius:50%;
  background:#eceaff;
  color:#5149d9;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:bold;
}

.pill,.badge{
  display:inline-block;
  padding:6px 10px;
  border-radius:30px;
  background:#eceaff;
  color:#5149d9;
  font-size:12px;
  font-weight:bold;
}

.notice{
  background:#eef8ff;
  padding:15px;
  border-radius:14px;
  margin:15px 0;
}

.alert{
  padding:16px;
  border-radius:14px;
  margin:14px 0;
}

.alert-ok{
  background:#eaf8ef;
  color:#176b39;
}

.alert-warn{
  background:#fff7df;
  color:#775800;
}

.alert-danger{
  background:#ffeded;
  color:#a51d1d;
}

.progress{
  height:8px;
  background:#e9e9ee;
  border-radius:20px;
  overflow:hidden;
  margin:12px 0 20px;
}

.progress span{
  display:block;
  height:100%;
  background:#6c63ff;
}

.actions{
  display:flex;
  gap:10px;
  justify-content:flex-end;
  flex-wrap:wrap;
  margin-top:20px;
}

.plan{
  position:relative;
}

.plan.current{
  outline:3px solid #6c63ff;
}

.plan.locked{
  opacity:.92;
}

.price{
  font-size:30px;
  font-weight:bold;
  margin:15px 0;
}

.check{
  color:#20a052;
  font-weight:bold;
}

.lock{
  color:#9a9a9a;
}

.switch{
  width:50px;
  height:28px;
  border:0;
  border-radius:30px;
  background:#ccc;
  position:relative;
}

.switch:after{
  content:"";
  width:22px;
  height:22px;
  border-radius:50%;
  background:white;
  position:absolute;
  top:3px;
  left:3px;
  transition:.2s;
}

.switch.on{
  background:#6c63ff;
}

.switch.on:after{
  left:25px;
}

.chat{
  margin-top:20px;
}

.msg{
  max-width:80%;
  padding:12px 15px;
  border-radius:16px;
  margin:8px 0;
}

.msg.me{
  margin-left:auto;
  background:#eceaff;
}

.msg.them{
  background:#eee;
}

.unread{
  background:#f5f3ff;
  padding-left:10px;
  padding-right:10px;
  border-radius:12px;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}
.modal-box{
  background:white;
  width:min(650px,100%);
  max-height:90vh;
  overflow:auto;
  border-radius:20px;
  padding:22px;
}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#222;
  color:white;
  padding:13px 18px;
  border-radius:30px;
  z-index:200;
}

.footer{
  text-align:center;
  padding:25px;
  color:#777;
}

.empty{
  text-align:center;
  padding:35px;
  color:#777;
}

hr{
  border:0;
  border-top:1px solid #eee;
  margin:22px 0;
}

@media(max-width:850px){
  .g3,.g4{
    grid-template-columns:1fr 1fr;
  }

  .nav{
    position:absolute;
    left:0;
    right:0;
    top:66px;
    background:white;
    padding:8px;
    border-bottom:1px solid #ddd;
  }

  .header{
    padding-bottom:60px;
  }
}

@media(max-width:600px){
  .g2,.g3,.g4{
    grid-template-columns:1fr;
  }

  main{
    padding:18px 12px 60px;
  }

  .card{
    padding:17px;
  }

  .actions .btn{
    width:100%;
  }
}
</style>
</head>

<body>

<div id="app"></div>

<script>
"use strict";

/* =========================================================
   SER CERCA · VERSIÓN DE PRUEBA
========================================================= */

const KEY="sercerca_demo_v6";

const DEFAULT={
  logged:false,
  onboarding:false,
  step:1,
  page:"home",

  role:"user",

  plan:"Básico",

  profile:{
    name:"",
    email:"",
    phone:"",
    city:"",
    notes:""
  },

  user:{
    name:"",
    email:""
  },

  contacts:[],

  notifications:[],

  history:[],

  messages:[],

  alarms:[],

  trial:{
    active:false,
    start:"",
    end:""
  },

  wellness:{
    status:"",
    last:"",
    questionIndex:0,
    answers:{},
    activity:""
  },

  sharing:{
    checkin:true,
    wellness:true,
    activity:true,
    messages:true
  },

  settings:{
    notifications:true,
    activity:true,
    location:false
  }
};

function copy(obj){
  return JSON.parse(JSON.stringify(obj));
}

function normalize(data){

  const base=copy(DEFAULT);

  if(!data || typeof data!=="object"){
    return base;
  }

  const result={
    ...base,
    ...data
  };

  result.profile={
    ...base.profile,
    ...(data.profile||{})
  };

  result.user={
    ...base.user,
    ...(data.user||{})
  };

  result.wellness={
    ...base.wellness,
    ...(data.wellness||{})
  };

  result.trial={
    ...base.trial,
    ...(data.trial||{})
  };

  result.sharing={
    ...base.sharing,
    ...(data.sharing||{})
  };

  result.settings={
    ...base.settings,
    ...(data.settings||{})
  };

  result.contacts=Array.isArray(data.contacts)
    ?data.contacts
    :[];

  result.notifications=Array.isArray(data.notifications)
    ?data.notifications
    :[];
  result.history=Array.isArray(data.history)
    ?data.history
    :[];

  result.messages=Array.isArray(data.messages)
    ?data.messages
    :[];

  result.alarms=Array.isArray(data.alarms)
    ?data.alarms
    :[];

  return result;
}

let S;

try{
  S=normalize(
    JSON.parse(
      localStorage.getItem(KEY)||"null"
    )
  );
}catch(e){
  S=copy(DEFAULT);
}

/* =========================================================
   UTILIDADES
========================================================= */

function esc(value){
  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function time(){
  return new Date().toLocaleString("es-ES",{
    dateStyle:"short",
    timeStyle:"short"
  });
}

function initials(name){
  return String(name||"?")
    .trim()
    .split(/\s+/)
    .slice(0,2)
    .map(x=>x[0])
    .join("")
    .toUpperCase()||"?";
}

function save(){

  try{
    localStorage.setItem(KEY,JSON.stringify(S));
    return true;
  }catch(error){
    console.error(error);
    return false;
  }
}

let toastTimer=null;

function toast(message){

  const old=document.querySelector(".toast");

  if(old)old.remove();

  const el=document.createElement("div");

  el.className="toast";
  el.textContent=message;

  document.body.appendChild(el);

  clearTimeout(toastTimer);

  toastTimer=setTimeout(()=>{
    el.remove();
  },3200);
}

function modal(title,content){

  close();

  const wrapper=document.createElement("div");

  wrapper.id="modal";
  wrapper.className="modal";

  wrapper.innerHTML=`
    <div
      class="modal-box"
      role="dialog"
      aria-modal="true">

      <div class="row between">

        <h2>${esc(title)}</h2>

        <button
          type="button"
          class="btn light"
          onclick="close()">

          ✕

        </button>

      </div>

      ${content}

    </div>
  `;

  document.body.appendChild(wrapper);
}

function close(){

  const el=document.getElementById("modal");

  if(el)el.remove();
}

/* =========================================================
   PLANES Y FUNCIONES
========================================================= */

const PLANS={

  "Básico":{
    price:"0 €",
    description:"Para empezar a estar cerca.",
    features:[
      "Perfil personal",
      "Número de teléfono",
      "Personas de confianza",
      "Check-in diario",
      "Estado de bienestar",
      "Aviso de ayuda",
      "Historial básico",
      "Privacidad básica"
    ]
  },

  "Familiar":{
    price:"2,99 €",
    description:"Más herramientas para acompañar.",
    features:[
      "Todo lo del Básico",
      "Mensajes",
      "Alarmas y recordatorios",
      "Recordatorios de medicamentos",
      "Zona familiar",
      "Avisos ampliados",
      "Confirmaciones de lectura",
      "Recomendaciones",
      "Historial ampliado",
      "Más controles de privacidad"
    ]
  },

  "Cerca":{
    price:"6,99 €",
    description:"La experiencia más completa.",
    features:[
      "Todo lo del Familiar",
      "Alarmas avanzadas",
      "Recordatorios recurrentes",
      "Más personas de confianza",
      "Seguimiento familiar ampliado",
      "Avisos prioritarios",
      "Confirmación avanzada de check-ins",
      "Historial completo",
      "Opciones familiares avanzadas",
      "Funciones futuras de ubicación",
      "Prioridad en nuevas funciones"
    ]
  }

};

const PLAN_ORDER=[
  "Básico",
  "Familiar",
  "Cerca"
];

function planLevel(){
  return PLAN_ORDER.indexOf(S.plan);
}

function hasFeature(feature){

  const level=planLevel();

  if(feature==="messages")
    return level>=1;

  if(feature==="alarms")
    return level>=1;

  if(feature==="advancedAlarms")
    return level>=2;

  if(feature==="family")
    return level>=1;

  if(feature==="advancedFamily")
    return level>=2;
  if(feature==="readReceipts")
    return level>=1;

  if(feature==="advancedNotifications")
    return level>=1;

  return true;
}

function requirePlan(required){

  if(planLevel()>=PLAN_ORDER.indexOf(required)){
    return true;
  }

  modal(
    "🔒 Función de "+required,
    `
      <div class="alert alert-warn">

        <b>Esta función pertenece al plan ${esc(required)}.</b>

        <br><br>

        Tu plan actual es
        <b>${esc(S.plan)}</b>.

        <br><br>

        Puedes consultar el plan y activarlo
        desde aquí.

      </div>

      <div class="actions">

        <button
          type="button"
          class="btn light"
          onclick="close()">

          Cancelar

        </button>

        <button
          type="button"
          class="btn primary"
          onclick="close();planDetails(${JSON.stringify(required)})">

          💳 Ver ${esc(required)}

        </button>

      </div>
    `
  );

  return false;
}

/* =========================================================
   HISTORIAL Y AVISOS
========================================================= */

function addHistory(action,detail){

  if(!S.settings.activity)return;

  S.history.unshift({
    id:Date.now()+Math.random(),
    action:String(action||""),
    detail:String(detail||""),
    date:time()
  });

  S.history=S.history.slice(0,150);
}

function addNotification(text,type,targetId){

  if(!S.settings.notifications)return;

  S.notifications.unshift({
    id:Date.now()+Math.random(),
    text:String(text||""),
    type:type||"general",
    target:targetId||null,
    read:false,
    date:time()
  });

  S.notifications=S.notifications.slice(0,150);
}

function markNotificationsRead(){

  S.notifications.forEach(n=>{
    n.read=true;
  });

  save();
}

/* =========================================================
   BIENVENIDA
========================================================= */

function welcome(){

  return `
    <main>

      <div class="hero">

        <div class="logo">♥</div>

        <h1>SerCerca</h1>

        <h2>Estar cerca sin quitar autonomía.</h2>

        <p class="muted">
          Una forma sencilla de mantener el contacto
          con las personas que tú eliges.
        </p>

        <div class="card">

          <h2>❤️ Bienvenido/a</h2>

          <p class="muted">
            Vamos a preparar tu cuenta paso a paso.
          </p>

          <button
            type="button"
            class="btn primary block"
            onclick="startApp()">

            🚀 Empezar

          </button>

        </div>

        <p class="small muted">
          Versión de prueba.
          Los datos se guardan en este navegador.
        </p>

      </div>

    </main>
  `;
}

function startApp(){

  S.logged=true;
  S.onboarding=true;
  S.step=1;
  S.page="home";

  save();
  render();
}

/* =========================================================
   ONBOARDING
========================================================= */

function onboarding(){

  const steps=[

    {
      title:"🌷 Bienvenida",
      text:"Vamos a preparar SerCerca paso a paso.",
      content:`
        <div class="alert alert-ok">
          <b>❤️ Estar cerca sin quitar autonomía.</b>
          <br><br>
          Tú decides qué personas pueden estar cerca
          y qué información quieres compartir.
        </div>
      `
    },

    {
      title:"👤 Tu perfil",
      text:"Completa tus datos.",
      content:`
        <div class="fg">
          <label>Nombre</label>
          <input
            id="pname"
            autocomplete="name"
            value="${esc(S.profile.name)}">
        </div>

        <div class="fg">
          <label>📞 Número de teléfono</label>
          <input
            id="pphone"
            type="tel"
            autocomplete="tel"
            placeholder="Tu número de teléfono"
            value="${esc(S.profile.phone)}">
          <span class="small muted">
            Servirá para poder llamarte en caso necesario.
          </span>
        </div>

        <div class="fg">
          <label>Correo electrónico</label>
          <input
            id="pemail"
            type="email"
            autocomplete="email"
            value="${esc(S.profile.email)}">
        </div>

        <div class="fg">
          <label>Ciudad</label>
          <input
            id="pcity"
            value="${esc(S.profile.city)}">
        </div>
      `
    },
    {
      title:"❤️ Personas de confianza",
      text:"Añade a las personas que quieres tener cerca.",
      content:`
        <div class="fg">
          <label>Nombre</label>
          <input id="cname">
        </div>

        <div class="fg">
          <label>Correo</label>
          <input id="cemail" type="email">
        </div>

        <div class="fg">
          <label>📞 Teléfono</label>
          <input id="cphone" type="tel">
        </div>

        <div class="fg">
          <label>Relación</label>
          <select id="crelation">
            <option>Hija/o</option>
            <option>Nieta/o</option>
            <option>Pareja</option>
            <option>Hermana/o</option>
            <option>Otro familiar</option>
          </select>
        </div>

        <div class="small muted">
          Puedes dejarlo vacío y añadir personas después.
        </div>
      `
    },

    {
      title:"🔗 Vinculación",
      text:"Puedes vincular a las personas añadidas.",
      content:`
        ${
          S.contacts.length
          ?
          S.contacts.map(c=>`
            <div class="item">

              <div class="row">

                <div class="avatar">
                  ${initials(c.name)}
                </div>

                <div>
                  <b>${esc(c.name)}</b><br>
                  <span class="muted">
                    ${esc(c.relation)}
                  </span>
                </div>

              </div>

              <button
                type="button"
                class="btn secondary"
                onclick="linkContact(${JSON.stringify(c.id)})">

                ${c.linked?"🔗 Vinculada":"Vincular"}

              </button>

            </div>
          `).join("")
          :
          `
            <div class="alert alert-warn">
              Todavía no has añadido ninguna persona.
            </div>
          `
        }
      `
    },

    {
      title:"🔐 Privacidad",
      text:"Tú decides qué compartes.",
      content:`
        ${privacySwitch("checkin","💚 Check-in","Permitir compartir check-ins")}
        ${privacySwitch("wellness","🌷 Bienestar","Permitir compartir estado")}
        ${privacySwitch("activity","🚶 Actividades","Permitir compartir actividades")}
        ${privacySwitch("messages","💌 Mensajes","Permitir funciones de mensajes")}
      `
    },

    {
      title:"🎁 Prueba",
      text:"Puedes probar las funciones avanzadas.",
      content:`
        <div class="alert alert-ok">
          <b>Versión de prueba</b>
          <br><br>
          Puedes activar una prueba de 14 días
          para comprobar las funciones avanzadas.
        </div>

        <button
          type="button"
          class="btn secondary block"
          onclick="trial()">

          🎁 Activar prueba

        </button>

        ${
          S.trial.active
          ?
          `<div class="alert alert-ok">
            🎁 Prueba activada.
          </div>`
          :""
        }
      `
    },

    {
      title:"👥 ¿Quién eres?",
      text:"Elige cómo quieres utilizar SerCerca.",
      content:`
        <div class="grid g2">

          <button
            type="button"
            class="choice"
            onclick="setRole('user')">

            <span class="emoji">👤</span>
            <b>Persona que utiliza SerCerca</b>
            <br>
            <span class="muted">
              Quiero mantener mi autonomía.
            </span>

          </button>

          <button
            type="button"
            class="choice"
            onclick="setRole('family')">

            <span class="emoji">👨‍👩‍👧</span>
            <b>Familiar o persona de confianza</b>
            <br>
            <span class="muted">
              Quiero acompañar a alguien.
            </span>

          </button>

        </div>

        <div class="notice">
          Rol actual:
          <b>
            ${
              S.role==="family"
              ?"Persona de confianza"
              :"Usuario/a"
            }
          </b>
        </div>
      `
    },

    {
      title:"✅ Todo preparado",
      text:"Ya puedes entrar en SerCerca.",
      content:`
        <div class="grid g3">

          <div class="stat">
            ❤️
            <b>Confianza</b>
            <span class="muted">
              Personas elegidas por ti.
            </span>
          </div>

          <div class="stat">
            💚
            <b>Check-in</b>
            <span class="muted">
              Seguimiento diario.
            </span>
          </div>

          <div class="stat">
            🔐
            <b>Privacidad</b>
            <span class="muted">
              Tú decides qué compartir.
            </span>
          </div>

        </div>
      `
    }
  ];

  const step=Math.min(
    Math.max(Number(S.step)||1,1),
    steps.length
  );

  const x=steps[step-1];

  return `
    <main>

      <div class="card" style="max-width:760px;margin:20px auto">

        <div class="small">
          PASO ${step} DE ${steps.length}
        </div>

        <div class="progress">
          <span style="width:${step/steps.length*100}%"></span>
        </div>

        <h1>${x.title}</h1>

        <p class="muted">${x.text}</p>

        ${x.content}

        <div class="actions">

          ${
            step>1
            ?
            `
              <button
                type="button"
                class="btn light"
                onclick="backSetup()">

                ← Atrás

              </button>
            `
            :""
          }

          <button
            type="button"
            class="btn primary"
            onclick="nextSetup()">

            ${
              step===steps.length
              ?"🚀 Entrar"
              :"Continuar →"
            }

          </button>

        </div>

      </div>

    </main>
  `;
}
function nextSetup(){

  const step=Number(S.step)||1;

  if(step===2){

    const name=document.getElementById("pname")?.value.trim()||"";
    const phone=document.getElementById("pphone")?.value.trim()||"";
    const email=document.getElementById("pemail")?.value.trim().toLowerCase()||"";
    const city=document.getElementById("pcity")?.value.trim()||"";

    if(!name){
      toast("Escribe tu nombre.");
      return;
    }

    S.profile.name=name;
    S.profile.phone=phone;
    S.profile.email=email;
    S.profile.city=city;

    S.user.name=name;
    S.user.email=email;

    save();
  }

  if(step===3){

    const name=document.getElementById("cname")?.value.trim()||"";
    const email=document.getElementById("cemail")?.value.trim()||"";
    const phone=document.getElementById("cphone")?.value.trim()||"";
    const relation=document.getElementById("crelation")?.value||"Otro familiar";

    if(name){

      const exists=S.contacts.some(
        c=>String(c.name).toLowerCase()===name.toLowerCase()
      );

      if(!exists){

        S.contacts.push({
          id:Date.now()+Math.random(),
          name,
          email,
          phone,
          relation,
          linked:false
        });

        addHistory("Persona añadida",name);
      }
    }

    save();
  }

  if(step===7){

    S.onboarding=false;
    S.page="home";

    addHistory(
      "Configuración inicial",
      "Completada"
    );

    save();
    render();

    toast("❤️ Bienvenido/a a SerCerca.");
    return;
  }

  S.step=step+1;

  save();
  render();
}

function backSetup(){

  const step=Number(S.step)||1;

  if(step>1){
    S.step=step-1;
    save();
    render();
  }
}

  if(!S.wellness.answers)
    S.wellness.answers={};

  S.wellness.answers[id]=value;

  if(id==="activity")
    S.wellness.activity=value;

  S.wellness.questionIndex=
    Number(S.wellness.questionIndex||0)+1;

  save();
  render();
}

function previousQuestion(){

  const current=
    Number(S.wellness.questionIndex)||0;

  if(current>0){

    S.wellness.questionIndex=current-1;

    save();
    render();

  }else{
    cancelCheckin();

function cancelCheckin(){

  S.wellness.questionIndex=0;
  S.wellness.answers={};

  const list=[];

  if(a.activity==="Dar un paseo")

      title:"Un paseo puede ser un buen plan",
      text:"Puedes invitar a una persona de confianza.",
      invite:true

  if(a.activity==="Cocinar algo")
    list.push({
      icon:"🍳",
      title:"¡Vamos a cocinar!",
      text:"Puedes preparar una receta que te guste.",
      invite:false
    });

  if(a.activity==="Cuidar mis plantas")
    list.push({
      icon:"🌱",
      title:"Un ratito con tus plantas",
      text:"Puedes regarlas o cuidar de ellas.",
      invite:false
    });

  if(a.activity==="Dibujar o hacer manualidades")
    list.push({
      icon:"🎨",
      title:"Un momento creativo",
      text:"Haz algo creativo que te guste.",
      invite:false
    });

  if(a.activity==="Leer")
    list.push({
      icon:"📖",
      title:"Un rato de lectura",
      text:"Elige un libro o revista.",
      invite:false
    });

  if(a.activity==="Escuchar música")
    list.push({
      icon:"🎵",
      title:"Pon tu música favorita",
      text:"Disfruta de unas canciones.",
      invite:false
    });

  if(a.activity==="Hablar con alguien")
    list.push({
      icon:"💌",
      title:"Una conversación puede alegrar el día",
      text:"Puedes llamar o escribir a alguien.",
      invite:true
    });

  if(a.company==="Me siento solo/a")
    list.push({
      icon:"❤️",
      title:"Podrías contactar con alguien",
      text:"Escribe a una persona de confianza.",
      invite:true

    list.push({
      icon:"😴",
      title:"También está bien descansar",
      text:"Tómate un momento tranquilo.",

    });

    list.push({
      icon:"🌷",
      title:"Haz algo que te guste",
      text:"Elige una actividad sencilla.",
      invite:false
    });

  return list.slice(0,3);

function shareCheckin(answers){

  if(!S.sharing.checkin)
    return;

  const contacts=S.contacts.filter(c=>c.linked);

  const summary=Object.entries(answers||{})
    .map(([key,value])=>
      questionName(key)+": "+value
    )
    .join(" · ");

  contacts.forEach(c=>{

    addNotification(
      `💚 Nuevo check-in de ${S.profile.name||"SerCerca"}: ${summary}`,
      "checkin",
      c.id
    );

    if(hasFeature("readReceipts")){

      addNotification(
        `👀 Check-in enviado a ${c.name}.`,
        "sent",
        null
      );
    }

  });

  if(contacts.length){

    addHistory(
      "Check-in compartido",
      contacts.map(c=>c.name).join(", ")
    );

  }
}

function addContact(event){

  event.preventDefault();

  const name=document.getElementById("newcname")?.value.trim()||"";
  const email=document.getElementById("newcemail")?.value.trim()||"";
  const phone=document.getElementById("newcphone")?.value.trim()||"";
  const relation=document.getElementById("newcrelation")?.value||"Otro familiar";

  if(!name){
    toast("Escribe el nombre.");
    return;
  }

  if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    toast("El correo no parece válido.");
    return;
  }

  if(S.contacts.some(
    c=>String(c.name).toLowerCase()===name.toLowerCase()
  )){
    toast("Esa persona ya está añadida.");
    return;
  }

  const contact={
    id:Date.now()+Math.random(),
    name,
    email,
    phone,
    relation,
    linked:false
  };

  S.contacts.push(contact);

  addHistory(
    "Persona añadida",
    contact.name
  );

  close();
  save();
  render();

  toast("❤️ Persona añadida.");
}

function linkContact(id){

  const c=S.contacts.find(
    x=>String(x.id)===String(id)
  );

  if(!c)return;

  c.linked=!c.linked;

  addHistory(
    c.linked
    ?"Persona vinculada"
    :"Persona desvinculada",
    c.name
  );

  save();
  render();

  toast(
    c.linked
    ?"🔗 Persona vinculada."
    :"🔗 Persona desvinculada."
  );
}
function removeContact(id){

  const c=S.contacts.find(
    x=>String(x.id)===String(id)
  );

  if(!c)return;

  modal(
    "Eliminar persona",
    `
      <p>
        ¿Seguro que quieres eliminar a
        <b>${esc(c.name)}</b>?
      </p>

      <div class="actions">

        <button
          class="btn light"
          onclick="close()">

          Cancelar

        </button>

        <button
          class="btn danger"
          onclick="confirmRemoveContact(${JSON.stringify(id)})">

          🗑️ Eliminar

        </button>

      </div>
    `
  );
}

function confirmRemoveContact(id){

  const c=S.contacts.find(
    x=>String(x.id)===String(id)
  );

  S.contacts=S.contacts.filter(
    x=>String(x.id)!==String(id)
  );

  if(c)
    addHistory(
      "Persona eliminada",
      c.name
    );

  close();
  save();
  render();

  toast("Persona eliminada.");
}

          "📋 Actividad",
          "Guardar actividad"
        )}

      </div>

    </div>

    <div class="card">

      <h2>💳 Plan actual</h2>

      <p>
        Tienes activado:
        <b>${esc(S.plan)}</b>
      </p>

      <button
        class="btn secondary"
        onclick="go('plans')">

        Ver planes

      </button>

    </div>

    <div class="card">

      <h2>🔐 Información</h2>

      <p class="muted">
        Esta versión guarda los datos localmente
        en el navegador.
      </p>

      <p class="muted">
        Los avisos, mensajes y llamadas reales entre
        móviles necesitarán posteriormente un servidor
        y servicios de comunicación.
      </p>

      <hr>

      <button
        class="btn danger"
        onclick="resetAccount()">

        🗑️ Reiniciar cuenta

      </button>

    </div>
  `;
}

function privacySwitch(key,title,text){

  return `
    <div class="item">

      <div>
        <b>${title}</b><br>
        <span class="small muted">
          ${text}
        </span>
      </div>

      <button
        class="switch ${S.sharing[key]?"on":""}"
        aria-pressed="${S.sharing[key]}"
        onclick="toggleShare('${key}')">

      </button>

    </div>
  `;
}

function generalSwitch(key,title,text){

  return `
    <div class="item">

      <div>
        <b>${title}</b><br>
        <span class="small muted">
          ${text}
        </span>
      </div>

      <button
        class="switch ${S.settings[key]?"on":""}"
        aria-pressed="${S.settings[key]}"
        onclick="toggleSetting('${key}')">

      </button>

    </div>
  `;
}

function toggleShare(key){

  if(!(key in S.sharing))return;

  S.sharing[key]=!S.sharing[key];

  save();
  render();
}

function toggleSetting(key){

  if(!(key in S.settings))return;

  S.settings[key]=!S.settings[key];

  save();
  render();
}

function saveProfile(){

  const name=document.getElementById("sname")?.value.trim()||"";
  const email=document.getElementById("semail")?.value.trim().toLowerCase()||"";
  const phone=document.getElementById("sphone")?.value.trim()||"";
  const city=document.getElementById("scity")?.value.trim()||"";
  const notes=document.getElementById("snotes")?.value.trim()||"";

  if(!name){
    toast("El nombre no puede estar vacío.");
    return;
  }

  if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    toast("El correo no parece válido.");
    return;
  }

  S.profile.name=name;
  S.profile.email=email;
  S.profile.phone=phone;
  S.profile.city=city;
  S.profile.notes=notes;

  S.user.name=name;
  S.user.email=email;

  addHistory(
    "Perfil actualizado",
    name
  );

  save();
  render();

  toast("💾 Perfil guardado.");
}

/* =========================================================
   PRUEBA
========================================================= */

function trial(){

  const start=new Date();

  const end=new Date(
    start.getTime()+14*24*60*60*1000
  );

  S.trial={
    active:true,
    start:start.toISOString(),
    end:end.toISOString()
  };

  addHistory(
    "Prueba gratuita",
    "14 días"
  );

  save();
  render();

  toast("🎁 Prueba de 14 días activada.");
}
/* =========================================================
   INVITACIONES
========================================================= */

function inviteFromRecommendation(){

  const contacts=S.contacts.filter(c=>c.linked);

  if(!contacts.length){

    modal(
      "❤️ Personas de confianza",
      `
        <div class="alert alert-warn">
          Primero vincula una persona.
        </div>

        <button
          class="btn primary block"
          onclick="close();go('people')">

          Añadir persona

        </button>
      `
    );

    return;
  }

  modal(
    "💌 Invitar a alguien",
    `
      <p>
        ¿A quién quieres invitar?
      </p>

      ${contacts.map(c=>`
        <button
          class="choice"
          onclick="sendInvitation(${JSON.stringify(c.id)})">

          <span class="emoji">❤️</span>

          <b>${esc(c.name)}</b>

          <br>

          <span class="muted">
            ${esc(c.relation)}
          </span>

        </button>
      `).join("")}
    `
  );
}

function sendInvitation(id){

  const c=S.contacts.find(
    x=>String(x.id)===String(id)
  );

  if(!c)return;

  addNotification(
    `🌷 ${S.profile.name||"SerCerca"} te ha enviado una invitación.`,
    "invitation",
    c.id
  );

  addHistory(
    "Invitación enviada",
    c.name
  );

  close();
  save();

  toast(
    "💌 Invitación preparada para "+c.name+"."
  );
}

/* =========================================================
   LOGOUT
========================================================= */

function logout(){

  S.logged=false;

  save();
  render();

  toast("Has cerrado sesión.");
}

/* =========================================================
   REINICIO
========================================================= */

function resetAccount(){

  modal(
    "⚠️ Reiniciar SerCerca",
    `
      <p>
        Esto borrará los datos guardados
        en este navegador.
      </p>

      <div class="alert alert-danger">
        Esta acción no se puede deshacer.
      </div>

      <div class="actions">

        <button
          class="btn light"
          onclick="close()">

          Cancelar

        </button>

        <button
          class="btn danger"
          onclick="reallyReset()">

          🗑️ Borrar todo

        </button>

      </div>
    `
  );
}

function reallyReset(){

  try{
    localStorage.removeItem(KEY);
  }catch(e){
    console.warn(e);
  }

  S=copy(DEFAULT);

  close();
  render();

  toast("SerCerca se ha reiniciado.");
}

/* =========================================================
   RENDER
========================================================= */

function render(){

  const root=document.getElementById("app");

  if(!root)return;

  try{

    let html;

    if(!S.logged){
      html=welcome();
    }
    else if(S.onboarding){
      html=onboarding();
    }
    else{
      html=app();
    }

    root.innerHTML=html;

  }catch(error){

    console.error(error);

    root.innerHTML=`
      <main>

        <div class="card">

          <div class="alert alert-danger">

            <h2>
              ⚠️ No se ha podido cargar SerCerca
            </h2>

            <p>
              Ha ocurrido un problema inesperado.
            </p>

          </div>

          <button
            class="btn primary block"
            onclick="safeRecovery()">

            🔄 Intentar recuperar

          </button>

          <button
            class="btn danger block"
            style="margin-top:10px"
            onclick="reallyReset()">

            🗑️ Reiniciar SerCerca

          </button>

        </div>

      </main>
    `;
  }
}

function safeRecovery(){

  try{

    S=normalize(S);

    save();
    render();

  }catch(error){

    console.error(error);

  }
}

/* =========================================================
   ERRORES GLOBALES
========================================================= */

window.addEventListener(
  "error",
  event=>{
    console.error(
      "Error global:",
      event.error||event.message
    );
  }
);

window.addEventListener(
  "unhandledrejection",
  event=>{
    console.error(
      "Promesa rechazada:",
      event.reason
    );
  }
);

/* =========================================================
   INICIO
========================================================= */

render();
// Arreglo global para todas las cruces de los modales
document.addEventListener("click", function(event) {
  // Si el elemento clicado es la cruz de cierre o tiene la clase para cerrar
  if (event.target.matches("button.btn.light") && event.target.textContent.includes("✕")) {
    const modalEl = document.getElementById("modal") || event.target.closest(".modal");
    if (modalEl) {
      modalEl.remove();
    }
  }
});
/* =========================================================
   ARREGLO INTELIGENTE: PANTALLA DE BENEFICIOS Y PLANES
========================================================= */
document.addEventListener('click', function(e) {
  const btn = e.target.closest('button, a');
  
  if (btn && btn.textContent && btn.textContent.includes('Ver y elegir')) {
    e.preventDefault();
    e.stopPropagation();
    
    const card = btn.closest('.card, .plan-card') || btn.parentElement;
    const titleElement = card ? (card.querySelector('h3') || card.querySelector('.title') || card.querySelector('h2')) : null;
    const planName = titleElement ? titleElement.textContent.trim() : "Básico";

    // Creamos la ventanita con los beneficios del plan que has elegido
    const modalHtml = `
      <div id="modal" class="modal" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:9999;">
        <div style="background:white; padding:25px; border-radius:15px; width:90%; max-width:400px; text-align:center;">
          <h2>Plan ${planName}</h2>
          <p style="margin: 15px 0;">Beneficios incluidos:</p>
          <ul style="text-align:left; margin-bottom: 20px; padding-left: 20px;">
            <li>Acceso a funciones de ${planName}</li>
            ${planName.toLowerCase().includes('familiar') ? '<li>Incluye sección de mensajes</li>' : '<li>Sección de mensajes no disponible</li>'}
          </ul>
          <button id="btnConfirmarPlan" style="padding:10px 20px; background:#28a745; color:white; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">Entrar al ${planName}</button>
          <br><br>
          <button id="btnCerrarModal" style="padding:5px 10px; background:#ccc; border:none; border-radius:5px; cursor:pointer;">Cancelar</button>
        </div>
      </div>
    `;
    
    // Lo añadimos a la pantalla
    document.body.insertAdjacentHTML('beforeend', modalHtml);

    // Acción al pulsar el botón de entrar dentro de la ventanita
    document.getElementById('btnConfirmarPlan').addEventListener('click', function() {
      if (typeof selectPlan === 'function') {
        selectPlan(planName);
      } else if (typeof S !== 'undefined') {
        S.plan = planName;
        // Si el plan es Básico u otro sin mensajes, intentamos ocultar los mensajes si existen
        if (!planName.toLowerCase().includes('familiar')) {
          const mensajesEl = document.querySelector('.mensajes, #mensajes');
          if (mensajesEl) mensajesEl.style.display = 'none';
        }
        if (typeof save === 'function') save();
        if (typeof render === 'function') render();
      }
      // Quitamos la ventanita
      const modal = document.getElementById('modal');
      if (modal) modal.remove();
    });

    // Acción para el botón de cancelar
    document.getElementById('btnCerrarModal').addEventListener('click', function() {
      const modal = document.getElementById('modal');
      if (modal) modal.remove();
    });
  }
}, true);



</script>
