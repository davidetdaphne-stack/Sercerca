<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#315c9b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>SerCerca</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
  overflow-x:hidden;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
  -webkit-user-select:none;
  user-select:none;
  touch-action:manipulation;
  -webkit-touch-callout:none;
}

button:active{
  transform:scale(.98);
}

.hidden{
  display:none!important;
}

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:white;
  border-bottom:1px solid #dfe5ee;
}

.header{
  max-width:1150px;
  margin:auto;
  padding:10px 15px;
  display:flex;
  align-items:center;
  gap:12px;
  min-height:64px;
}

.logo{
  width:43px;
  height:43px;
  min-width:43px;
  border-radius:14px;
  background:#315c9b;
  color:white;
  display:grid;
  place-items:center;
  font-size:23px;
  font-weight:bold;
}

.brand{
  font-weight:bold;
  font-size:21px;
  color:#315c9b;
  white-space:nowrap;
}

.nav{
  margin-left:auto;
  display:flex;
  gap:6px;
  overflow-x:auto;
  overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  max-width:100%;
  padding:3px;
}

.nav::-webkit-scrollbar{
  display:none;
}

.nav button{
  white-space:nowrap;
  border:0;
  background:#eef4ff;
  color:#315c9b;
  padding:11px 13px;
  min-height:44px;
  border-radius:10px;
  font-weight:bold;
}

.nav button:hover{
  background:#dce9ff;
}

.logout{
  min-height:44px;
  white-space:nowrap;
}

main{
  max-width:1150px;
  margin:auto;
  padding:30px 16px 70px;
}

.hero{
  max-width:850px;
  margin:70px auto;
  text-align:center;
}

.hero h1{
  font-size:65px;
  color:#315c9b;
  margin:15px 0;
}

.hero p{
  font-size:20px;
  line-height:1.55;
  color:#667085;
}

.card{
  background:white;
  border:1px solid #dfe5ee;
  border-radius:20px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 8px 25px rgba(25,48,80,.06);
}

h1{
  font-size:34px;
  margin:0 0 8px;
}

h2{
  margin:0 0 9px;
}

h3{
  margin:0 0 7px;
}

.muted{
  color:#667085;
}

.small{
  font-size:13px;
}

.badge{
  display:inline-block;
  background:#eef4ff;
  color:#315c9b;
  padding:7px 12px;
  border-radius:99px;
  font-weight:bold;
  font-size:13px;
}

.btn{
  border:0;
  border-radius:12px;
  padding:13px 17px;
  min-height:46px;
  font-weight:bold;
  touch-action:manipulation;
}
.primary{
  background:#315c9b;
  color:white;
}

.secondary{
  background:#eef4ff;
  color:#315c9b;
}

.light{
  background:white;
  border:1px solid #dfe5ee;
  color:#172033;
}

.success{
  background:#23865a;
  color:white;
}

.danger{
  background:#c43d3d;
  color:white;
}

.block{
  width:100%;
}

.actions{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-top:16px;
}

.grid{
  display:grid;
  gap:16px;
}

.g2{
  grid-template-columns:repeat(2,minmax(0,1fr));
}

.g3{
  grid-template-columns:repeat(3,minmax(0,1fr));
}

.g4{
  grid-template-columns:repeat(4,minmax(0,1fr));
}

.fg{
  margin-bottom:15px;
}

.fg label{
  display:block;
  font-weight:bold;
  margin-bottom:6px;
}

.fg input,
.fg select,
.fg textarea{
  width:100%;
  padding:13px;
  min-height:46px;
  border:1px solid #dfe5ee;
  border-radius:11px;
  background:white;
  outline:none;
}

.fg input:focus,
.fg select:focus,
.fg textarea:focus{
  border-color:#315c9b;
  box-shadow:0 0 0 3px rgba(49,92,155,.12);
}

.fg textarea{
  min-height:110px;
  resize:vertical;
}

.progress{
  height:8px;
  background:#e5eaf1;
  border-radius:99px;
  overflow:hidden;
  margin:15px 0 25px;
}

.progress span{
  display:block;
  height:100%;
  background:#315c9b;
  transition:.25s;
}

.choice{
  width:100%;
  text-align:left;
  border:2px solid #dfe5ee;
  background:white;
  border-radius:16px;
  padding:18px;
  margin:6px 0;
  min-height:70px;
  touch-action:manipulation;
}

.choice:hover,
.choice.selected{
  border-color:#315c9b;
  background:#eef4ff;
}

.emoji{
  display:block;
  font-size:30px;
  margin-bottom:7px;
}

.row{
  display:flex;
  align-items:center;
  gap:12px;
}

.between{
  justify-content:space-between;
}

.wrap{
  flex-wrap:wrap;
}

.stat{
  background:white;
  border:1px solid #dfe5ee;
  border-radius:16px;
  padding:18px;
}

.stat b{
  display:block;
  font-size:25px;
  margin:5px 0;
}

.big{
  width:100%;
  border:0;
  border-radius:17px;
  padding:25px;
  min-height:80px;
  font-size:21px;
  font-weight:bold;
  touch-action:manipulation;
}

.ok{
  background:#eaf8f0;
  color:#237b54;
}

.help{
  background:#fff0f0;
  color:#c43d3d;
}

.alert{
  padding:14px;
  border-radius:13px;
  margin:12px 0;
}

.alert-ok{
  background:#eaf8f0;
  color:#237b54;
}

.alert-warn{
  background:#fff8e5;
  color:#8a6419;
}

.alert-danger{
  background:#fff0f0;
  color:#a82e2e;
}

.item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  border:1px solid #dfe5ee;
  border-radius:13px;
  padding:13px;
  margin:9px 0;
  background:white;
}

.avatar{
  width:48px;
  height:48px;
  min-width:48px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#eef4ff;
  color:#315c9b;
  font-weight:bold;
}

.pill{
  display:inline-block;
  padding:6px 10px;
  border-radius:99px;
  background:#eef4ff;
  color:#315c9b;
  font-weight:bold;
  font-size:12px;
}

.plan.current{
  border:2px solid #315c9b;
}

.price{
  font-size:35px;
  font-weight:bold;
  color:#315c9b;
}

.check{
  color:#23865a;
  font-weight:bold;
}

.chat{
  height:320px;
  overflow:auto;
  background:#f8fafc;
  border:1px solid #dfe5ee;
  border-radius:15px;
  padding:12px;
  margin-top:15px;
}

.msg{
  max-width:80%;
  padding:11px 13px;
  border-radius:15px;
  margin:7px 0;
  overflow-wrap:anywhere;
}

.me{
  margin-left:auto;
  background:#315c9b;
  color:white;
}

.them{
  background:white;
  border:1px solid #dfe5ee;
}

.footer{
  text-align:center;
  color:#667085;
  font-size:13px;
  padding:25px;
}

.toast{
  position:fixed;
  right:15px;
  bottom:15px;
  background:#172033;
  color:white;
  padding:14px 17px;
  border-radius:12px;
  z-index:5000;
  max-width:330px;
  box-shadow:0 8px 25px rgba(0,0,0,.2);
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:grid;
  place-items:center;
  padding:16px;
  z-index:4000;
}

.modal-box{
  background:white;
  border-radius:20px;
  padding:22px;
  width:min(600px,100%);
  max-height:90vh;
  overflow:auto;
}

.switch{
  width:52px;
  height:29px;
  border:0;
  border-radius:99px;
  background:#cbd5e1;
  position:relative;
  min-width:52px;
}

.switch:after{
  content:"";
  position:absolute;
  width:23px;
  height:23px;
  background:white;
  border-radius:50%;
  top:3px;
  left:3px;
  transition:.2s;
}

.switch.on{
  background:#315c9b;
}

.switch.on:after{
  left:26px;
}

hr{
  border:0;
  border-top:1px solid #e1e6ed;
  margin:22px 0;
}

.notice{
  border-left:4px solid #315c9b;
  background:#eef4ff;
  padding:14px;
  border-radius:10px;
  margin:10px 0;
}

.unread{
  border-left:4px solid #315c9b;
  background:#f5f9ff;
}

.empty{
  text-align:center;
  padding:55px 20px;
  color:#667085;
}

@media(max-width:900px){

  .header{
    flex-wrap:wrap;
  }

  .nav{
    order:3;
    width:100%;
    margin-left:0;
  }

  .logout{
    margin-left:auto;
  }

}

@media(max-width:800px){

  .g2,
  .g3,
  .g4{
    grid-template-columns:1fr;
  }

  .hero{
    margin:40px auto;
  }

  .hero h1{
    font-size:48px;
  }

  main{
    padding:22px 12px 60px;
  }

  .card{
    padding:18px;
  }

  h1{
    font-size:29px;
  }

  .nav button{
    font-size:13px;
    padding:10px 12px;
  }

}

@media(max-width:480px){

  .brand{
    font-size:18px;
  }

  .logo{
    width:40px;
    height:40px;
    min-width:40px;
  }

  .logout{
    padding:10px 12px;
  }

  .actions .btn{
    flex:1 1 140px;
  }

  .hero h1{
    font-size:43px;
  }

}
</style>
</head>

<body>

<div id="app"></div>

<script>

/* =========================================================
   SER CERCA
   VERSIÓN CORREGIDA
========================================================= */

const KEY="sercerca_v5";

const DEFAULT={
  logged:false,
  onboarding:true,
  step:1,
  page:"home",

  user:{
    name:"",
    email:"",
    password:""
  },

  profile:{
    name:"",
    email:"",
    phone:"",
    city:"",
    notes:""
  },

  role:"",

  contacts:[],

  notifications:[],

  messages:[],

  history:[],

  wellness:{
    answers:{},
    status:"",
    activity:"",
    last:"",
    questionIndex:0
  },

  sharing:{
    checkin:true,
    wellness:true,
    activity:true,
    messages:true
  },

  plan:"Básico",

  trial:{
    active:false,
    start:"",
    end:""
  },

  settings:{
    notifications:true,
    activity:true,
    location:false
  }
};

let S=load();
/* =========================================================
   DATOS
========================================================= */

function copy(x){
  return JSON.parse(JSON.stringify(x));
}

function load(){

  try{

    const saved=localStorage.getItem(KEY);

    if(!saved){
      return copy(DEFAULT);
    }

    const data=JSON.parse(saved);

    return merge(copy(DEFAULT),data);

  }catch(error){

    console.error("Error cargando datos:",error);

    return copy(DEFAULT);

  }

}

function merge(base,data){

  Object.keys(data||{}).forEach(key=>{

    if(
      data[key] &&
      typeof data[key]==="object" &&
      !Array.isArray(data[key])
    ){

      base[key]={
        ...(base[key]||{}),
        ...data[key]
      };

    }else{

      base[key]=data[key];

    }

  });

  return base;

}

function save(){

  try{

    localStorage.setItem(
      KEY,
      JSON.stringify(S)
    );

  }catch(error){

    console.error("Error guardando:",error);

    toast("No se pudieron guardar los cambios.");

  }

}


/* =========================================================
   UTILIDADES
========================================================= */

function esc(value){

  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function time(){

  return new Date().toLocaleString(
    "es-ES",
    {
      dateStyle:"short",
      timeStyle:"short"
    }
  );

}

function initials(name){

  const result=(name||"?")
    .trim()
    .split(/\s+/)
    .filter(Boolean)
    .map(x=>x[0])
    .join("")
    .substring(0,2)
    .toUpperCase();

  return result||"?";

}

function toast(text){

  document
    .querySelectorAll(".toast")
    .forEach(x=>x.remove());

  const t=document.createElement("div");

  t.className="toast";
  t.textContent=text;

  document.body.appendChild(t);

  setTimeout(()=>{
    if(t.parentNode){
      t.remove();
    }
  },2800);

}

function addHistory(action,detail=""){

  if(!S.settings.activity){
    return;
  }

  S.history.unshift({
    id:Date.now()+Math.random(),
    action,
    detail,
    date:time()
  });

  S.history=S.history.slice(0,150);

}

function addNotification(text,type="info",target=""){

  if(!S.settings.notifications){
    return;
  }

  S.notifications.unshift({

    id:Date.now()+Math.random(),

    text,

    type,

    target,

    date:time(),

    read:false

  });

  S.notifications=
    S.notifications.slice(0,100);

}

function go(page){

  S.page=page;

  save();

  render();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

function markNotificationsRead(){

  S.notifications.forEach(n=>{
    n.read=true;
  });

  save();

}


/* =========================================================
   BIENVENIDA
========================================================= */

function welcome(){

  return `

    <main>

      <section class="hero">

        <span class="badge">
          🌷 Tranquilidad y acompañamiento
        </span>

        <h1>SerCerca</h1>

        <p>
          Una aplicación para mantener cerca
          a las personas que quieres,
          respetando su autonomía.
        </p>

        <div
          class="actions"
          style="justify-content:center">

          <button
            type="button"
            class="btn primary"
            onclick="register()">

            📝 Crear cuenta

          </button>

          <button
            type="button"
            class="btn light"
            onclick="login()">

            🔐 Iniciar sesión

          </button>

        </div>

      </section>

    </main>

  `;

}


/* =========================================================
   REGISTRO
========================================================= */

function register(){

  S.role="";

  modal(
    "📝 Crear cuenta",

    `

    <form onsubmit="create(event)">

      <div class="fg">

        <label for="rname">
          Nombre
        </label>

        <input
          id="rname"
          autocomplete="name"
          required>

      </div>

      <div class="fg">

        <label for="remail">
          Correo
        </label>

        <input
          id="remail"
          type="email"
          autocomplete="email"
          required>

      </div>
      <div class="fg">

        <label for="rpass">
          Contraseña
        </label>

        <input
          id="rpass"
          type="password"
          minlength="6"
          autocomplete="new-password"
          required>

        <div class="small muted">
          Mínimo 6 caracteres.
        </div>

      </div>

      <div class="fg">

        <label>
          ¿Para quién es?
        </label>

        <button
          type="button"
          class="choice"
          onclick="role('elder',this)">

          <span class="emoji">👵</span>

          <b>Para mí</b>

          <br>

          <span class="muted">
            Soy la persona que utilizará SerCerca.
          </span>

        </button>

        <button
          type="button"
          class="choice"
          onclick="role('family',this)">

          <span class="emoji">👨‍👩‍👧</span>

          <b>Para mi familiar</b>

          <br>

          <span class="muted">
            Quiero acompañar a un familiar.
          </span>

        </button>

      </div>

      <label>

        <input
          id="terms"
          type="checkbox"
          required>

        Acepto las condiciones.

      </label>

      <br><br>

      <button
        type="submit"
        class="btn primary block">

        Crear cuenta

      </button>

    </form>

    `
  );

}

function role(r,button){

  S.role=r;

  document
    .querySelectorAll("#modal .choice")
    .forEach(x=>{
      x.classList.remove("selected");
    });

  if(button){
    button.classList.add("selected");
  }

}

function create(event){

  event.preventDefault();

  const name=
    document.getElementById("rname")
    ?.value.trim();

  const email=
    document.getElementById("remail")
    ?.value.trim()
    .toLowerCase();

  const password=
    document.getElementById("rpass")
    ?.value;

  if(!name || !email || !password){

    toast("Completa todos los campos.");

    return;

  }

  if(password.length<6){

    toast("La contraseña debe tener al menos 6 caracteres.");

    return;

  }

  if(!S.role){

    toast("Selecciona para quién es SerCerca.");

    return;

  }

  S.user={
    name,
    email,
    password
  };

  S.profile.name=name;
  S.profile.email=email;

  S.logged=true;
  S.onboarding=true;
  S.step=1;
  S.page="home";

  addHistory(
    "Cuenta creada",
    "Configuración inicial"
  );

  close();

  save();

  render();

}


/* =========================================================
   LOGIN
========================================================= */

function login(){

  modal(
    "🔐 Iniciar sesión",

    `

    <form onsubmit="enter(event)">

      <div class="fg">

        <label for="lemail">
          Correo
        </label>

        <input
          id="lemail"
          type="email"
          autocomplete="email"
          required>

      </div>

      <div class="fg">

        <label for="lpass">
          Contraseña
        </label>

        <input
          id="lpass"
          type="password"
          autocomplete="current-password"
          required>

      </div>

      <button
        type="submit"
        class="btn primary block">

        Entrar

      </button>

    </form>

    `
  );

}

function enter(event){

  event.preventDefault();

  const email=
    document.getElementById("lemail")
    ?.value.trim()
    .toLowerCase();

  const pass=
    document.getElementById("lpass")
    ?.value;

  if(!S.user.email){

    toast(
      "No existe ninguna cuenta en este navegador. Crea una cuenta primero."
    );

    return;

  }

  if(
    email!==S.user.email ||
    pass!==S.user.password
  ){

    toast("Correo o contraseña incorrectos.");

    return;

  }

  S.logged=true;

  if(S.step>=7){
    S.onboarding=false;
  }

  close();

  save();

  render();

  toast("👋 Has iniciado sesión.");

}


/* =========================================================
   MODAL
========================================================= */

function modal(title,content){

  close();

  document.body.insertAdjacentHTML(
    "beforeend",

    `

    <div
      class="modal"
      id="modal"
      role="dialog"
      aria-modal="true">

      <div class="modal-box">

        <div class="row between">

          <h2>${esc(title)}</h2>

          <button
            type="button"
            class="btn light"
            onclick="close()"
            aria-label="Cerrar">

            ✕

          </button>

        </div>

        <hr>

        ${content}

      </div>

    </div>

    `
  );

}

function close(){

  document
    .getElementById("modal")
    ?.remove();

}


/* =========================================================
   ONBOARDING
========================================================= */

function onboarding(){

  const steps=[

    {
      title:"🌷 Bienvenida",
      text:"Vamos a preparar SerCerca paso a paso.",
      content:`

        <div class="alert alert-ok">

          <b>
            ❤️ Estar cerca sin quitar autonomía.
          </b>

          <br><br>

          SerCerca te ayuda a mantener el contacto
          con las personas que tú elijas.

        </div>

      `
    },

    {
      title:"👤 Tu perfil",
      text:"Completa tus datos.",
      content:`

        <div class="fg">

          <label for="pname">
            Nombre
          </label>

          <input
            id="pname"
            value="${esc(S.profile.name)}">

        </div>

        <div class="fg">

          <label for="pphone">
            Teléfono
          </label>

          <input
            id="pphone"
            type="tel"
            value="${esc(S.profile.phone)}">

        </div>

        <div class="fg">

          <label for="pcity">
            Ciudad
          </label>

          <input
            id="pcity"
            value="${esc(S.profile.city)}">

        </div>

      `
    },
    {
      title:"❤️ Personas de confianza",
      text:"Añade a las personas que quieres tener cerca.",
      content:`

        <div class="fg">

          <label for="cname">
            Nombre
          </label>

          <input
            id="cname">

        </div>

        <div class="fg">

          <label for="cemail">
            Correo
          </label>

function nextSetup(){

  if(S.step===2){

    const name=
      document.getElementById("pname")
      ?.value.trim();

    const phone=
      document.getElementById("pphone")
      ?.value.trim();

    const city=
      document.getElementById("pcity")
      ?.value.trim();

    if(name){
      S.profile.name=name;
      S.user.name=name;
    }

    S.profile.phone=phone;
    S.profile.city=city;

    save();

  }

  if(S.step===3){

    const name=
      document.getElementById("cname")
      ?.value.trim();

    const email=
      document.getElementById("cemail")
      ?.value.trim();

    const relation=
      document.getElementById("crelation")
      ?.value;

    if(name){

      const exists=S.contacts.some(
        c=>
          c.name.toLowerCase()===name.toLowerCase()
      );

      if(!exists){

        S.contacts.push({

          id:Date.now()+Math.random(),

          name,

          email,

          relation,

          linked:false

        });

        addHistory(
          "Persona añadida",
          name
        );

      }

    }

  }

  if(S.step===7){

    S.onboarding=false;
    S.page="home";

    addHistory(
      "Configuración inicial",
      "Completada"
    );

    save();

    render();

    toast("❤️ Bienvenido a SerCerca.");

    return;

  }

  S.step++;

  save();

  render();

}

function backSetup(){

  if(S.step>1){

    S.step--;

    save();

    render();

  }

}

function checkin(){

  const total=QUESTIONS.length;

  const index=
    Number(S.wellness.questionIndex)||0;

  if(index>=total){
    return checkinSummary();
  }

  const q=QUESTIONS[index];

  return `

      class="card"
      style="max-width:750px;margin:auto">

function answer(id,value){

  S.wellness.answers[id]=value;

  if(id==="activity"){
    S.wellness.activity=value;
  }

  S.wellness.questionIndex=
    Number(S.wellness.questionIndex||0)+1;

  save();

  render();

}

function previousQuestion(){

  const current=
    Number(S.wellness.questionIndex)||0;

  if(current>0){

    S.wellness.questionIndex=current-1;

    save();

    render();

  }else{

    cancelCheckin();

  }

}

function cancelCheckin(){

  S.wellness.questionIndex=0;
  S.wellness.answers={};
  S.wellness.activity="";

  save();

  go("home");

}

function shareCheckin(answers){

  if(!S.sharing.checkin){
    return;
  }

  const contacts=
    S.contacts.filter(c=>c.linked);

  const summary=
    Object.entries(answers||{})
      .map(
        ([key,value])=>
          questionName(key)+": "+value
      )
      .join(" · ");

  contacts.forEach(c=>{

    /*
      IMPORTANTE:
      Aquí se crea un aviso DESTINADO a esa persona.
      Sigue siendo local en esta versión.
    */

    addNotification(
      `💚 Nuevo check-in de ${S.profile.name}: ${summary}`,
      "checkin",
      c.id
    );

  });

  addHistory(
    "Check-in compartido",
    contacts.map(c=>c.name).join(", ")
  );

}

function addContact(event){

  event.preventDefault();

  const name=
    document.getElementById("newcname")
    ?.value.trim();

  const email=
    document.getElementById("newcemail")
    ?.value.trim();

  const relation=
    document.getElementById("newcrelation")
    ?.value;

  if(!name){

    toast("Escribe el nombre.");

    return;

  }

  const exists=S.contacts.some(
    c=>
      c.name.toLowerCase()===name.toLowerCase()
  );

  if(exists){

    toast("Esa persona ya está añadida.");

    return;

  }

  const contact={

    id:Date.now()+Math.random(),

    name,

    email,

    relation,

    linked:false

  };

  S.contacts.push(contact);

  addHistory(
    "Persona añadida",
    contact.name
  );

  close();

  save();

  render();

  toast("❤️ Persona añadida.");

}

function linkContact(id){

  const c=
    S.contacts.find(x=>x.id===id);

  if(!c)return;

  c.linked=!c.linked;

  addHistory(
    c.linked
      ?"Persona vinculada"
      :"Persona desvinculada",
    c.name
  );

  save();

  render();

  toast(
    c.linked
      ?"🔗 Persona vinculada."
      :"🔗 Persona desvinculada."
  );

}

function removeContact(id){

  const c=
    S.contacts.find(x=>x.id===id);

  if(!c)return;

  modal(
    "Eliminar persona",

    `

    <p>
      ¿Seguro que quieres eliminar a
      <b>${esc(c.name)}</b>?
    </p>

    <div class="actions">

      <button
        type="button"
        class="btn light"
        onclick="close()">

        Cancelar

      </button>

      <button
        type="button"
        class="btn danger"
        onclick="confirmRemoveContact(${id})">

        🗑️ Eliminar

      </button>

    </div>

    `
  );

}

function confirmRemoveContact(id){

  const c=
    S.contacts.find(x=>x.id===id);

  S.contacts=
    S.contacts.filter(x=>x.id!==id);

  if(c){

    addHistory(
      "Persona eliminada",
      c.name
    );

  }

  close();

  save();

  render();

  toast("Persona eliminada.");

}

  }

  modal(

          `).join("")}

function sendMessage(event){

  event.preventDefault();

  const contactId=
    document.getElementById("mto")
    ?.value;

  const text=
    document.getElementById("mtext")
    ?.value.trim();

  const contact=
    S.contacts.find(
      c=>String(c.id)===String(contactId)
    );

  if(!contact){

    toast("Selecciona una persona.");

    return;

  }

  if(!text){

    toast("Escribe un mensaje.");

    return;

  }

  const message={

    id:Date.now()+Math.random(),

    me:true,

    to:contact.name,

    contactId:contact.id,

    text,

    date:time()

  };

  S.messages.push(message);

  addNotification(
    `💌 Has enviado un mensaje a ${contact.name}.`,
    "message",
    contact.id
  );

  addHistory(
    "Mensaje enviado",
    contact.name
  );

  close();

  save();

  render();

  toast("💌 Mensaje preparado.");

}

        type="button"
        class="switch ${
          S.sharing[key]?"on":""
        }"
        aria-label="${esc(title)}"
        onclick="toggleShare('${key}')">
      </button>

    </div>

  `;

}

function setting(key,title,text){

  return privacySwitch(
    key,
    title,
    text
  );

}

function generalSwitch(key,title,text){

  return `

    <div class="item">

      <div>

        <b>
          ${title}
        </b>

        <br>

        <span class="muted small">
          ${text}
        </span>

      </div>

      <button
        type="button"
        class="switch ${
          S.settings[key]?"on":""
        }"
        onclick="toggleSetting('${key}')">
      </button>

    </div>

  `;

}

function toggleShare(key){

  if(!(key in S.sharing)){
    return;
  }

  S.sharing[key]=
    !S.sharing[key];

  save();

  render();

}

function toggleSetting(key){

  if(!(key in S.settings)){
    return;
  }

  S.settings[key]=
    !S.settings[key];

  save();

  render();

}

function saveProfile(){

  const name=
    document.getElementById("sname")
    ?.value.trim();

  const email=
    document.getElementById("semail")
    ?.value.trim()
    .toLowerCase();

  const phone=
    document.getElementById("sphone")
    ?.value.trim();

  const city=
    document.getElementById("scity")
    ?.value.trim();

  const notes=
    document.getElementById("snotes")
    ?.value.trim();

  if(!name){

    toast("El nombre no puede estar vacío.");

    return;

  }

  if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){

    toast("El correo no parece válido.");

    return;

  }

  S.profile.name=name;
  S.profile.email=email;
  S.profile.phone=phone;
  S.profile.city=city;
  S.profile.notes=notes;

  S.user.name=name;

  if(email){
    S.user.email=email;
  }

  addHistory(
    "Perfil actualizado",
    name
  );

  save();

  render();

  toast("💾 Perfil guardado correctamente.");

}


/* =========================================================
   PRUEBA GRATUITA
========================================================= */

function trial(){

  const start=new Date();

  const end=
    new Date(
      start.getTime()+
      14*24*60*60*1000
    );

  S.trial={
    active:true,
    start:start.toISOString(),
    end:end.toISOString()
  };

  addHistory(
    "Prueba gratuita",
    "14 días"
  );

  save();

  toast(
    "🎁 Prueba de 14 días activada."
  );

}


/* =========================================================
   INVITACIONES
========================================================= */

function inviteFromRecommendation(){

  const contacts=
    S.contacts.filter(c=>c.linked);

  if(!contacts.length){

    modal(
      "❤️ Personas de confianza",

      `

      <div class="alert alert-warn">

        Primero vincula una persona
        de confianza.

      </div>

      <button
        type="button"
        class="btn primary block"
        onclick="close();go('people')">

        Añadir persona

      </button>

      `
    );

    return;

  }

  modal(
    "💌 Invitar a alguien",

    `

    <p>
      ¿A quién quieres invitar?
    </p>

    ${contacts.map(c=>`

      <button
        type="button"
        class="choice"
        onclick="sendInvitation(${c.id})">

        <span class="emoji">
          ❤️
        </span>

        <b>
          ${esc(c.name)}
        </b>

        <br>

        <span class="muted">
          ${esc(c.relation)}
        </span>

      </button>

    `).join("")}

    `
  );

}

function sendInvitation(id){

  const c=
    S.contacts.find(x=>x.id===id);

  if(!c){
    return;
  }

  addNotification(
    `🌷 ${S.profile.name} te ha enviado una invitación.`,
    "invitation",
    c.id
  );

  addHistory(
    "Invitación enviada",
    c.name
  );

  close();

  save();

  toast(
    "💌 Invitación preparada para "+c.name+"."
  );

}


/* =========================================================
   LOGOUT
========================================================= */

function logout(){

  S.logged=false;

  save();

  render();

  toast("Has cerrado sesión.");

}


/* =========================================================
   REINICIO DE CUENTA
========================================================= */

function resetAccount(){

  modal(
    "⚠️ Reiniciar SerCerca",

    `

    <p>
      Esto borrará los datos guardados
      en este navegador.
    </p>

    <div class="alert alert-danger">

      Esta acción no se puede deshacer.

    </div>

    <div class="actions">

      <button
        type="button"
        class="btn light"
        onclick="close()">

        Cancelar

      </button>

      <button
        type="button"
        class="btn danger"
        onclick="reallyReset()">

        🗑️ Borrar todo

      </button>

    </div>

    `
  );

}

function reallyReset(){

  localStorage.removeItem(KEY);

  S=copy(DEFAULT);

  close();

  render();

  toast("SerCerca se ha reiniciado.");

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  let html;

  if(!S.logged){

    html=welcome();

  }else if(S.onboarding){

    html=onboarding();

  }else{

    html=app();

  }

  const root=
    document.getElementById("app");

  if(root){
    root.innerHTML=html;
  }

}


/* =========================================================
   INICIO
========================================================= */

render();

</script>
