<body>

<div id="app"></div>

<script>

const KEY="sercerca_v2";

const DEFAULT={
logged:false,
onboarding:true,
step:1,
page:"home",

user:{
name:"",
email:"",
password:""
},

profile:{
name:"",
email:"",
phone:"",
city:"",
notes:""
},

role:"",

contacts:[],

notifications:[],

messages:[],

history:[],

wellness:{
answers:{},
status:"",
activity:"",
last:""
},

sharing:{
checkin:true,
wellness:true,
activity:true,
messages:true
},

plan:"Básico",

trial:{
active:false,
start:"",
end:""
},

settings:{
notifications:true,
activity:true,
location:false
}
};
let S=load();


function copy(x){
return JSON.parse(JSON.stringify(x));
}


function load(){

try{

const saved=JSON.parse(
localStorage.getItem(KEY)
);

if(!saved)return copy(DEFAULT);

return merge(
copy(DEFAULT),
saved
);

}catch(e){

return copy(DEFAULT);

}

}


function merge(base,data){

Object.keys(data).forEach(k=>{

if(
data[k] &&
typeof data[k]==="object" &&
!Array.isArray(data[k])
){

base[k]={
...base[k],
...data[k]
};

}else{

base[k]=data[k];

}

});

return base;

}


function save(){

localStorage.setItem(
KEY,
JSON.stringify(S)
);

}


function esc(x){

return String(x??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;");

}


function time(){

return new Date().toLocaleString(
"es-ES",
{
dateStyle:"short",
timeStyle:"short"
}
);

}


function initials(name){

return (name||"?")
.split(" ")
.map(x=>x[0])
.join("")
.substring(0,2)
.toUpperCase();

}


function toast(text){

const t=document.createElement("div");

t.className="toast";

t.textContent=text;

document.body.appendChild(t);

setTimeout(
()=>t.remove(),
2500
);

}


function history(action,detail=""){

S.history.unshift({
id:Date.now(),
action,
detail,
date:time()
});

S.history=S.history.slice(0,150);

}


function notification(text,type="info"){

if(!S.settings.notifications)return;

S.notifications.unshift({
id:Date.now(),
text,
type,
date:time(),
read:false
});

}


function go(page){

S.page=page;

save();

render();

window.scrollTo({
top:0,
behavior:"smooth"
});

}

/* =========================
   REGISTRO
========================= */

function register(){

modal(
"📝 Crear cuenta",

`

<form onsubmit="create(event)">

<div class="fg">
<label>Nombre</label>
<input id="rname" required>
</div>

<div class="fg">
<label>Correo</label>
<input id="remail" type="email" required>
</div>

<div class="fg">
<label>Contraseña</label>
<input id="rpass" type="password" minlength="6" required>
</div>
<div class="fg">

<label>¿Para quién es?</label>

<button
type="button"
class="choice"
onclick="role('elder',this)">

<span class="emoji">👵</span>

<b>Para mí</b>

<br>

<span class="muted">
Soy la persona que utilizará SerCerca.
</span>

</button>

<button
type="button"
class="choice"
onclick="role('family',this)">

<span class="emoji">👨‍👩‍👧</span>

<b>Para mi familiar</b>

<br>

<span class="muted">
Quiero acompañar a un familiar.
</span>

</button>

</div>

<label>
<input id="terms" type="checkbox" required>
Acepto las condiciones.
</label>

<br><br>

<button class="btn primary block">
Crear cuenta
</button>

</form>

`
);

}


function role(r,b){

S.role=r;

document
.querySelectorAll(".choice")
.forEach(x=>x.classList.remove("selected"));

b.classList.add("selected");

}


function create(e){

e.preventDefault();

if(!S.role){

toast("Selecciona una opción.");

return;

}

S.user={
name:rname.value.trim(),
email:remail.value.trim(),
password:rpass.value
};

S.profile.name=S.user.name;
S.profile.email=S.user.email;

S.logged=true;
S.onboarding=true;
S.step=1;

close();

save();
render();

}


/* =========================
   LOGIN
========================= */

function login(){

modal(
"🔐 Iniciar sesión",

`

<form onsubmit="enter(event)">

<div class="fg">
<label>Correo</label>
<input id="lemail" type="email" required>
</div>

<div class="fg">
<label>Contraseña</label>
<input id="lpass" type="password" required>
</div>

<button class="btn primary block">
Entrar
</button>

</form>

`
);

}


function enter(e){

e.preventDefault();

if(
S.user.email &&
(
lemail.value!==S.user.email ||
lpass.value!==S.user.password
)
){

toast("Datos incorrectos.");

return;

}

S.logged=true;
S.onboarding=false;

close();

save();
render();

}


/* =========================
   MODAL
========================= */

function modal(title,content){

document.body.insertAdjacentHTML(
"beforeend",

`

<div class="modal" id="modal">

<div class="modal-box">

<div class="row between">

<h2>${title}</h2>

<button
class="btn light"
onclick="close()">
✕
</button>

</div>

<hr>

${content}

</div>

</div>

`
);

}


function close(){

document
.getElementById("modal")
?.remove();

}

   ONBOARDING

function onboarding(){

const steps=[

content:`

<b>❤️ Estar cerca sin quitar autonomía.</b>

SerCerca te ayuda a mantener el contacto

},

<input id="pname"
value="${esc(S.profile.name)}">
</div>

<div class="fg">
<label>Teléfono</label>
<input id="pphone"
value="${esc(S.profile.phone)}">
</div>

<div class="fg">
<label>Ciudad</label>
<input id="pcity"
value="${esc(S.profile.city)}">
</div>

`
},
{
title:"❤️ Personas de confianza",
text:"Añade a las personas que quieres tener cerca.",
content:`

<div class="fg">
<label>Nombre</label>
<input id="cname">
</div>

<div class="fg">
<label>Correo</label>
<input id="cemail" type="email">
</div>

<div class="fg">
<label>Relación</label>
<select id="crelation">
<option>Hija/o</option>
<option>Nieta/o</option>
<option>Pareja</option>
<option>Hermana/o</option>
<option>Otro familiar</option>
</select>
</div>

`
},

{
title:"🔗 Vinculación",
text:"Puedes vincular a la persona.",
content:`

${
S.contacts.length
?
S.contacts.map(c=>`

<div class="item">

<div class="row">

<div class="avatar">
${initials(c.name)}
</div>

<div>
<b>${esc(c.name)}</b>
<br>
<span class="muted">
${esc(c.relation)}
</span>
</div>

</div>

<button
class="btn secondary"
onclick="link(${c.id})">

${c.linked?"🔗 Vinculada":"Vincular"}

</button>

</div>

`).join("")
:
`
<div class="alert alert-warn">
Todavía no has añadido ninguna persona.
Puedes hacerlo después.
</div>
`
}

`
},

{
title:"🔐 Privacidad",
text:"Tú decides qué compartes.",
content:`

${setting(
"checkin",
"💚 Check-in",
"Permitir compartir check-ins"
)}

${setting(
"wellness",
"🌷 Bienestar",
"Permitir compartir estado"
)}

${setting(
"activity",
"🚶 Actividades",
"Permitir compartir actividades"
)}

`
},

{
title:"🎁 Prueba gratuita",
text:"Prueba las funciones avanzadas.",
content:`

<div class="alert alert-warn">

<b>14 días gratis</b>

<br><br>

Puedes probar las funciones
avanzadas durante 14 días.

</div>

<button
class="btn secondary block"
onclick="trial()">
🎁 Activar prueba
</button>

`
},

{
title:"✅ Todo preparado",
text:"Ya puedes entrar en SerCerca.",
content:`

<div class="grid g3">

<div class="stat">
❤️
<b>Confianza</b>
<span class="muted">
Personas elegidas por ti.
</span>
</div>

<div class="stat">
💚
<b>Check-in</b>
<span class="muted">
Mucho más completo.
</span>
</div>

<div class="stat">
🔐
<b>Privacidad</b>
<span class="muted">
Tú decides qué compartir.
</span>
</div>

</div>

`
}

];

const x=steps[S.step-1];

return `

<main>

<div class="card"
style="max-width:720px;margin:20px auto">

<div class="small">
PASO ${S.step} DE ${steps.length}
</div>

<div class="progress">
<span style="
width:${S.step/steps.length*100}%
"></span>
</div>

<h1>${x.title}</h1>

<p class="muted">${x.text}</p>

${x.content}

<div class="actions">

<button
class="btn light"
onclick="backSetup()">
← Atrás
</button>

<button
class="btn primary"
onclick="nextSetup()">

${S.step===steps.length
?"🚀 Entrar"
:"Continuar →"}

</button>

</div>

</div>

</main>

`;

}


function nextSetup(){

if(S.step===2){

S.profile.name=
document.getElementById("pname").value.trim();

S.profile.phone=
document.getElementById("pphone").value.trim();

S.profile.city=
document.getElementById("pcity").value.trim();

}

if(S.step===3){

const n=document.getElementById("cname");

if(n?.value.trim()){

S.contacts.push({
id:Date.now(),
name:n.value.trim(),
email:document.getElementById("cemail").value.trim(),
relation:document.getElementById("crelation").value,
linked:false
});

}

}

if(S.step===7){

S.onboarding=false;
S.page="home";

history(
"Configuración inicial",
"Completada"
);

save();
render();

toast("❤️ Bienvenido a SerCerca.");

return;

}

S.step++;

save();
render();

}
function backSetup(){

if(S.step>1){

S.step--;

save();
render();

}

}

case"people":

case"messages":

return home();

}

function checkin(){

const index=
S.wellness.questionIndex||0;

if(index>=total){

return checkinSummary();

}

const q=QUESTIONS[index];

return `

<div class="card"
style="max-width:750px;margin:auto">

<div class="small">
CHECK-IN · ${index+1} DE ${total}
</div>

<div class="progress">
<span style="
width:${(index+1)/total*100}%
"></span>
</div>

<h1>${q.title}</h1>

<p class="muted">
Pulsa una respuesta para continuar.
</p>

${q.options.map(o=>`

<button
class="choice"
onclick="answer(
'${q.id}',
'${o[1].replace(/'/g,"\\'")}'
)">

<span class="emoji">${o[0]}</span>

<b>${o[1]}</b>

<div class="actions">

function answer(id,value){

S.wellness.answers[id]=value;

if(id==="activity"){

S.wellness.activity=value;

}

S.wellness.questionIndex=
(S.wellness.questionIndex||0)+1;

save();
render();

}

function previousQuestion(){

if(
(S.wellness.questionIndex||0)>0
){

S.wellness.questionIndex--;

save();
render();

}else{

cancelCheckin();

}


function cancelCheckin(){

S.wellness.questionIndex=0;

function questionName(id){

const names={
mood:"Estado de ánimo",

food:"Alimentación",
water:"Agua",
pain:"Dolor",
medicine:"Medicamentos",
outside:"Salir de casa",
social:"Contacto social",
company:"Acompañamiento",
need:"Necesidad",
activity:"Actividad"
};

return names[id]||id;

}

========================= */

function getRecommendations(a){

const list=[];

if(a.activity==="Dar un paseo"){

list.push({

icon:"🚶",

title:"Un paseo puede ser un buen plan",

text:
"Si te apetece, puedes invitar a una amiga o familiar y dar un paseo juntos.",

invite:true

});

}

if(a.activity==="Cocinar algo"){

list.push({

icon:"🍳",

title:"¡Vamos a cocinar!",

text:
"Puedes preparar una receta que te guste y, si quieres, compartirla con alguien.",

invite:false

});

}

if(a.activity==="Cuidar mis plantas"){

list.push({

icon:"🌱",

title:"Un ratito con tus plantas",

text:
"Puedes regarlas, quitar hojas secas o preparar una nueva planta.",

invite:false

});

}

if(a.activity==="Dibujar o hacer manualidades"){

list.push({

icon:"🎨",

title:"Un momento creativo",

text:
"Busca algo que tengas por casa y crea algo que te guste.",

invite:false

});

}

if(a.activity==="Leer"){

list.push({

icon:"📖",

title:"Un rato de lectura",

text:
"Elige un libro, revista o historia que te apetezca leer.",

invite:false

});

}

if(a.activity==="Escuchar música"){

list.push({

icon:"🎵",

title:"Pon tu música favorita",

text:
"Puedes escuchar algunas canciones que te hagan sentir bien.",

invite:false

});

}

if(a.activity==="Hablar con alguien"){

list.push({

icon:"💌",

title:"Una conversación puede alegrar el día",

text:
"Puedes escribir o llamar a una persona de confianza.",

invite:true

});

}

if(a.activity==="Ver a una amiga"){

list.push({

icon:"👩‍🦰",

title:"¡Un plan con una amiga!",

text:
"Puedes escribirle y preguntarle si quiere tomar algo o salir contigo.",

invite:true

});

}

if(a.activity==="Descansar"){

list.push({

icon:"😴",

title:"También está bien descansar",

text:
"Busca un lugar cómodo y tómate un momento tranquilo.",

invite:false

});

}

if(
a.company==="Me siento solo/a"
){

list.push({

icon:"❤️",

title:"Hoy podrías contactar con alguien",

text:
"Si te apetece, escribe a una persona de confianza y cuéntale cómo estás.",

});

}

if(!list.length){

list.push({

icon:"🌷",

title:"Haz algo que te guste",

text:
"Hoy puedes elegir una actividad sencilla que te haga sentir bien.",

invite:false

});

}

return list.slice(0,3);

}

}

"Compartir check-ins"
)}

${privacySwitch(
"wellness",
"🌷 Bienestar",
"Compartir estado"
)}

${privacySwitch(
"activity",
"🚶 Actividades",
"Compartir actividades"
)}

</div>

</div>

`;

}


function privacySwitch(key,title,text){

return `

<div class="item">

<div>

<b>${title}</b>

<br>

<span class="muted small">
${text}
</span>

</div>

<button
class="switch ${
S.sharing[key]?"on":""
}"
onclick="toggleShare('${key}')">
</button>

</div>

`;

}


function toggleShare(key){

S.sharing[key]=!S.sharing[key];

save();

render();

}


function saveProfile(){

S.profile.name=sname.value.trim();
S.profile.phone=sphone.value.trim();
S.profile.city=scity.value.trim();

S.user.name=S.profile.name;

history(
"Perfil actualizado",
S.profile.name
);

save();

render();

toast("💾 Guardado.");

}

   SETTINGS GENERALES
========================= */

function setting(key,title,text){

return `

<div class="item">

<div>

<b>${title}</b>

<br>

<span class="muted small">
${text}
</span>

</div>

<button
class="switch ${
S.sharing[key]?"on":""
}"
onclick="toggleShare('${key}')">
</button>

</div>

`;

}


/* =========================
   PRUEBA
========================= */

function trial(){

const start=new Date();

const end=
new Date(
start.getTime()+
14*24*60*60*1000
);

S.trial={
active:true,
start:start.toISOString(),
end:end.toISOString()
};

history(
"Prueba gratuita",
"14 días"
);

save();

toast(
"🎁 Prueba de 14 días activada."
);

}


/* =========================
   LOGOUT
========================= */

function logout(){

S.logged=false;

save();

render();

}


/* =========================
   RENDER
========================= */

function render(){

let html;

if(!S.logged){

html=welcome();

}else if(S.onboarding){

html=onboarding();

}else{

html=app();

}

document.getElementById("app")
.innerHTML=html;

}

render();

</script>

</body>
</html>
