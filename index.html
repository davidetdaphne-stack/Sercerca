<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#315c9b">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SerCerca</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
  overflow-x:hidden
}

button,input,select,textarea{
  font:inherit
}

button{
  cursor:pointer;
  -webkit-user-select:none;
  user-select:none;
  touch-action:manipulation;
  -webkit-touch-callout:none
}

button:active{
  transform:scale(.98)
}

.hidden{
  display:none!important
}

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:white;
  border-bottom:1px solid #dfe5ee
}

.header{
  max-width:1150px;
  margin:auto;
  padding:10px 15px;
  display:flex;
  align-items:center;
  gap:12px;
  min-height:64px
}

.logo{
  width:43px;
  height:43px;
  min-width:43px;
  border-radius:14px;
  background:#315c9b;
  color:white;
  display:grid;
  place-items:center;
  font-size:23px;
  font-weight:bold
}

.brand{
  font-weight:bold;
  font-size:21px;
  color:#315c9b;
  white-space:nowrap
}

.nav{
  margin-left:auto;
  display:flex;
  gap:6px;
  overflow-x:auto;
  overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  touch-action:pan-x;
  max-width:100%;
  padding:3px
}

.nav::-webkit-scrollbar{
  display:none
}

.nav button{
  white-space:nowrap;
  border:0;
  background:#eef4ff;
  color:#315c9b;
  padding:11px 13px;
  min-height:44px;
  border-radius:10px;
  font-weight:bold;
  position:relative;
  z-index:2;
  pointer-events:auto
}

.nav button:hover{
  background:#dce9ff
}

.logout{
  min-height:44px;
  white-space:nowrap
}

main{
  max-width:1150px;
  margin:auto;
  padding:30px 16px 70px
}

.hero{
  max-width:850px;
  margin:70px auto;
  text-align:center
}

.hero h1{
  font-size:65px;
  color:#315c9b;
  margin:15px 0
}

.hero p{
  font-size:20px;
  line-height:1.55;
  color:#667085
}

.card{
  background:white;
  border:1px solid #dfe5ee;
  border-radius:20px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 8px 25px rgba(25,48,80,.06)
}

h1{
  font-size:34px;
  margin:0 0 8px
}

h2{
  margin:0 0 9px
}

h3{
  margin:0 0 7px
}

.muted{
  color:#667085
}

.small{
  font-size:13px
}

.badge{
  display:inline-block;
  background:#eef4ff;
  color:#315c9b;
  padding:7px 12px;
  border-radius:99px;
  font-weight:bold;
  font-size:13px
}

.btn{
  border:0;
  border-radius:12px;
  padding:13px 17px;
  min-height:46px;
  font-weight:bold;
  touch-action:manipulation
}

.primary{
  background:#315c9b;
  color:white
}
.secondary{
  background:#eef4ff;
  color:#315c9b
}

.light{
  background:white;
  border:1px solid #dfe5ee;
  color:#172033
}

.success{
  background:#23865a;
  color:white
}

.danger{
  background:#c43d3d;
  color:white
}

.block{
  width:100%
}

.actions{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-top:16px
}

.grid{
  display:grid;
  gap:16px
}

.g2{
  grid-template-columns:repeat(2,minmax(0,1fr))
}

.g3{
  grid-template-columns:repeat(3,minmax(0,1fr))
}

.g4{
  grid-template-columns:repeat(4,minmax(0,1fr))
}

.fg{
  margin-bottom:15px
}

.fg label{
  display:block;
  font-weight:bold;
  margin-bottom:6px
}

.fg input,
.fg select,
.fg textarea{
  width:100%;
  padding:13px;
  min-height:46px;
  border:1px solid #dfe5ee;
  border-radius:11px;
  background:white;
  outline:none
}

.fg input:focus,
.fg select:focus,
.fg textarea:focus{
  border-color:#315c9b;
  box-shadow:0 0 0 3px rgba(49,92,155,.12)
}

.fg textarea{
  min-height:110px;
  resize:vertical
}

.progress{
  height:8px;
  background:#e5eaf1;
  border-radius:99px;
  overflow:hidden;
  margin:15px 0 25px
}

.progress span{
  display:block;
  height:100%;
  background:#315c9b;
  transition:.25s
}

.choice{
  width:100%;
  text-align:left;
  border:2px solid #dfe5ee;
  background:white;
  border-radius:16px;
  padding:18px;
  margin:6px 0;
  min-height:70px;
  touch-action:manipulation;
  pointer-events:auto
}

.choice:hover,
.choice.selected{
  border-color:#315c9b;
  background:#eef4ff
}

.emoji{
  display:block;
  font-size:30px;
  margin-bottom:7px
}

.row{
  display:flex;
  align-items:center;
  gap:12px
}

.between{
  justify-content:space-between
}

.wrap{
  flex-wrap:wrap
}

.stat{
  background:white;
  border:1px solid #dfe5ee;
  border-radius:16px;
  padding:18px
}

.stat b{
  display:block;
  font-size:25px;
  margin:5px 0
}

.big{
  width:100%;
  border:0;
  border-radius:17px;
  padding:25px;
  min-height:80px;
  font-size:21px;
  font-weight:bold;
  touch-action:manipulation
}

.ok{
  background:#eaf8f0;
  color:#237b54
}

.help{
  background:#fff0f0;
  color:#c43d3d
}

.alert{
  padding:14px;
  border-radius:13px;
  margin:12px 0
}

.alert-ok{
  background:#eaf8f0;
  color:#237b54
}

.alert-warn{
  background:#fff8e5;
  color:#8a6419
}

.alert-danger{
  background:#fff0f0;
  color:#a82e2e
}

.item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  border:1px solid #dfe5ee;
  border-radius:13px;
  padding:13px;
  margin:9px 0;
  background:white
}

.avatar{
  width:48px;
  height:48px;
  min-width:48px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#eef4ff;
  color:#315c9b;
  font-weight:bold
}

.pill{
  display:inline-block;
  padding:6px 10px;
  border-radius:99px;
  background:#eef4ff;
  color:#315c9b;
  font-weight:bold;
  font-size:12px
}

.plan.current{
  border:2px solid #315c9b
}

.price{
  font-size:35px;
  font-weight:bold;
  color:#315c9b
}

.check{
  color:#23865a;
  font-weight:bold
}

.chat{
  height:320px;
  overflow:auto;
  background:#f8fafc;
  border:1px solid #dfe5ee;
  border-radius:15px;
  padding:12px;
  margin-top:15px
}

.msg{
  max-width:80%;
  padding:11px 13px;
  border-radius:15px;
  margin:7px 0;
  overflow-wrap:anywhere
}

.me{
  margin-left:auto;
  background:#315c9b;
  color:white
}

.them{
  background:white;
  border:1px solid #dfe5ee
}

.footer{
  text-align:center;
  color:#667085;
  font-size:13px;
  padding:25px
}

.toast{
  position:fixed;
  right:15px;
  bottom:15px;
  background:#172033;
  color:white;
  padding:14px 17px;
  border-radius:12px;
  z-index:5000;
  max-width:330px;
  box-shadow:0 8px 25px rgba(0,0,0,.2)
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:grid;
  place-items:center;
  padding:16px;
  z-index:4000
}

.modal-box{
  background:white;
  border-radius:20px;
  padding:22px;
  width:min(600px,100%);
  max-height:90vh;
  overflow:auto
}
.switch{
  width:52px;
  height:29px;
  border:0;
  border-radius:99px;
  background:#cbd5e1;
  position:relative;
  min-width:52px;
  touch-action:manipulation
}

.switch:after{
  content:"";
  position:absolute;
  width:23px;
  height:23px;
  background:white;
  border-radius:50%;
  top:3px;
  left:3px;
  transition:.2s
}

.switch.on{
  background:#315c9b
}

.switch.on:after{
  left:26px
}

hr{
  border:0;
  border-top:1px solid #e1e6ed;
  margin:22px 0
}

.notice{
  border-left:4px solid #315c9b;
  background:#eef4ff;
  padding:14px;
  border-radius:10px;
  margin:10px 0
}

.unread{
  border-left:4px solid #315c9b;
  background:#f5f9ff
}

@media(max-width:900px){

.header{
  flex-wrap:wrap
}

.nav{
  order:3;
  width:100%;
  margin-left:0
}

.logout{
  margin-left:auto
}

}

@media(max-width:800px){

.g2,
.g3,
.g4{
  grid-template-columns:1fr
}

.hero{
  margin:40px auto
}

.hero h1{
  font-size:48px
}

main{
  padding:22px 12px 60px
}

.card{
  padding:18px
}

h1{
  font-size:29px
}

.nav button{
  font-size:13px;
  padding:10px 12px
}

}

@media(max-width:480px){

.brand{
  font-size:18px
}

.logo{
  width:40px;
  height:40px;
  min-width:40px
}

.logout{
  padding:10px 12px
}

.actions .btn{
  flex:1 1 140px
}

.hero h1{
  font-size:43px
}

}
</style>
</head>

<body>

<div id="app"></div>

<script>

/* =========================================================
   SER CERCA
   Versión completa
========================================================= */

const KEY="sercerca_v4";

const DEFAULT={
  logged:false,
  onboarding:true,
  step:1,
  page:"home",

  user:{
    name:"",
    email:"",
    password:""
  },

  profile:{
    name:"",
    email:"",
    phone:"",
    city:"",
    notes:""
  },

  role:"",

  contacts:[],

  notifications:[],

  messages:[],

  history:[],

  wellness:{
    answers:{},
    status:"",
    activity:"",
    last:"",
    questionIndex:0
  },

  sharing:{
    checkin:true,
    wellness:true,
    activity:true,
    messages:true
  },

  plan:"Básico",

  trial:{
    active:false,
    start:"",
    end:""
  },

  settings:{
    notifications:true,
    activity:true,
    location:false
  }
};

let S=load();


/* =========================================================
   DATOS
========================================================= */

function copy(x){
  return JSON.parse(JSON.stringify(x));
}
function load(){

  try{

    const saved=JSON.parse(
      localStorage.getItem(KEY)
    );

    if(!saved){
      return copy(DEFAULT);
    }

    return merge(copy(DEFAULT),saved);

  }catch(e){

    console.error(e);

    return copy(DEFAULT);

  }

}

function merge(base,data){

  Object.keys(data||{}).forEach(k=>{

    if(
      data[k] &&
      typeof data[k]==="object" &&
      !Array.isArray(data[k])
    ){

      base[k]={
        ...(base[k]||{}),
        ...data[k]
      };

    }else{

      base[k]=data[k];

    }

  });

  return base;

}

function save(){

  try{

    localStorage.setItem(
      KEY,
      JSON.stringify(S)
    );

  }catch(e){

    console.error("No se pudo guardar:",e);

  }

}


/* =========================================================
   UTILIDADES
========================================================= */

function esc(x){

  return String(x??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function time(){

  return new Date().toLocaleString(
    "es-ES",
    {
      dateStyle:"short",
      timeStyle:"short"
    }
  );

}

function initials(name){

  return (name||"?")
    .split(" ")
    .filter(Boolean)
    .map(x=>x[0])
    .join("")
    .substring(0,2)
    .toUpperCase();

}

function toast(text){

  const old=document.querySelectorAll(".toast");

  old.forEach(x=>x.remove());

  const t=document.createElement("div");

  t.className="toast";
  t.textContent=text;

  document.body.appendChild(t);

  setTimeout(
    ()=>t.remove(),
    2600
  );

}

function addHistory(action,detail=""){

  S.history.unshift({
    id:Date.now(),
    action,
    detail,
    date:time()
  });

  S.history=S.history.slice(0,150);

}

function notification(text,type="info"){

  if(!S.settings.notifications){
    return;
  }

  S.notifications.unshift({
    id:Date.now(),
    text,
    type,
    date:time(),
    read:false
  });

  S.notifications=S.notifications.slice(0,100);

}

function go(page){

  S.page=page;

  save();

  render();

  setTimeout(()=>{
    window.scrollTo({
      top:0,
      behavior:"smooth"
    });
  },10);

}

function markNotificationsRead(){

  S.notifications.forEach(n=>{
    n.read=true;
  });

  save();

}


/* =========================================================
   BIENVENIDA
========================================================= */

function welcome(){

  return `

  <main>

    <section class="hero">

      <span class="badge">
        🌷 Tranquilidad y acompañamiento
      </span>

      <h1>SerCerca</h1>

      <p>
        Una aplicación para mantener cerca
        a las personas que quieres,
        respetando su autonomía.
      </p>

      <div
        class="actions"
        style="justify-content:center">

        <button
          class="btn primary"
          onclick="register()">
          📝 Crear cuenta
        </button>

        <button
          class="btn light"
          onclick="login()">
          🔐 Iniciar sesión
        </button>

      </div>

    </section>

  </main>

  `;

}
/* =========================================================
   REGISTRO
========================================================= */

function register(){

  modal(
    "📝 Crear cuenta",

    `

    <form onsubmit="create(event)">

      <div class="fg">
        <label>Nombre</label>
        <input id="rname" required>
      </div>

      <div class="fg">
        <label>Correo</label>
        <input id="remail" type="email" required>
      </div>

      <div class="fg">
        <label>Contraseña</label>
        <input
          id="rpass"
          type="password"
          minlength="6"
          required>
      </div>

      <div class="fg">

        <label>¿Para quién es?</label>

        <button
          type="button"
          class="choice"
          onclick="role('elder',this)">

          <span class="emoji">👵</span>

          <b>Para mí</b>

          <br>

          <span class="muted">
            Soy la persona que utilizará SerCerca.
          </span>

        </button>

        <button
          type="button"
          class="choice"
          onclick="role('family',this)">

          <span class="emoji">👨‍👩‍👧</span>

          <b>Para mi familiar</b>

          <br>

          <span class="muted">
            Quiero acompañar a un familiar.
          </span>

        </button>

      </div>

      <label>
        <input
          id="terms"
          type="checkbox"
          required>
        Acepto las condiciones.
      </label>

      <br><br>

      <button class="btn primary block">
        Crear cuenta
      </button>

    </form>

    `
  );

}

function role(r,b){

  S.role=r;

  document
    .querySelectorAll(".choice")
    .forEach(x=>x.classList.remove("selected"));

  if(b){
    b.classList.add("selected");
  }

}

function create(e){

  e.preventDefault();

  if(!S.role){

    toast("Selecciona una opción.");

    return;

  }

  S.user={
    name:document.getElementById("rname").value.trim(),
    email:document.getElementById("remail").value.trim(),
    password:document.getElementById("rpass").value
  };

  S.profile.name=S.user.name;
  S.profile.email=S.user.email;

  S.logged=true;
  S.onboarding=true;
  S.step=1;
  S.page="home";

  addHistory(
    "Cuenta creada",
    "Configuración inicial"
  );

  close();
  save();
  render();

}


/* =========================================================
   LOGIN
========================================================= */

function login(){

  modal(
    "🔐 Iniciar sesión",

    `

    <form onsubmit="enter(event)">

      <div class="fg">
        <label>Correo</label>
        <input
          id="lemail"
          type="email"
          required>
      </div>

      <div class="fg">
        <label>Contraseña</label>
        <input
          id="lpass"
          type="password"
          required>
      </div>

      <button class="btn primary block">
        Entrar
      </button>

    </form>

    `
  );

}

function enter(e){

  e.preventDefault();

  const email=
    document.getElementById("lemail").value.trim();

  const pass=
    document.getElementById("lpass").value;

  if(
    S.user.email &&
    (
      email!==S.user.email ||
      pass!==S.user.password
    )
  ){

    toast("Datos incorrectos.");

    return;

  }

  S.logged=true;

  if(S.step>=7){
    S.onboarding=false;
  }

  close();
  save();
  render();

}


/* =========================================================
   MODAL
========================================================= */

function modal(title,content){

  close();

  document.body.insertAdjacentHTML(
    "beforeend",

    `

    <div
      class="modal"
      id="modal">

      <div class="modal-box">

        <div class="row between">

          <h2>${esc(title)}</h2>

          <button
            class="btn light"
            onclick="close()">
            ✕
          </button>

        </div>

        <hr>

        ${content}

      </div>

    </div>

    `
  );

}
function close(){

  document
    .getElementById("modal")
    ?.remove();

}


/* =========================================================
   ONBOARDING
========================================================= */

function onboarding(){

  const steps=[

    {
      title:"🌷 Bienvenida",
      text:"Vamos a preparar SerCerca paso a paso.",
      content:`

        <div class="alert alert-ok">

          <b>
            ❤️ Estar cerca sin quitar autonomía.
          </b>

          <br><br>

          SerCerca te ayuda a mantener el contacto
          con las personas que tú elijas.

        </div>

      `
    },

    {
      title:"👤 Tu perfil",
      text:"Completa tus datos.",
      content:`

        <div class="fg">
          <label>Nombre</label>
          <input
            id="pname"
            value="${esc(S.profile.name)}">
        </div>

        <div class="fg">
          <label>Teléfono</label>
          <input
            id="pphone"
            value="${esc(S.profile.phone)}">
        </div>

        <div class="fg">
          <label>Ciudad</label>
          <input
            id="pcity"
            value="${esc(S.profile.city)}">
        </div>

      `
    },

    {
      title:"❤️ Personas de confianza",
      text:"Añade a las personas que quieres tener cerca.",
      content:`

        <div class="fg">
          <label>Nombre</label>
          <input id="cname">
        </div>

        <div class="fg">
          <label>Correo</label>
          <input
            id="cemail"
            type="email">
        </div>

        <div class="fg">
          <label>Relación</label>

          <select id="crelation">

            <option>Hija/o</option>
            <option>Nieta/o</option>
            <option>Pareja</option>
            <option>Hermana/o</option>
            <option>Otro familiar</option>

          </select>

        </div>

      `
    },

    {
      title:"🔗 Vinculación",
      text:"Puedes vincular a la persona.",
      content:`

        ${
          S.contacts.length
          ?
          S.contacts.map(c=>`

            <div class="item">

              <div class="row">

                <div class="avatar">
                  ${initials(c.name)}
                </div>

                <div>
                  <b>${esc(c.name)}</b>
                  <br>
                  <span class="muted">
                    ${esc(c.relation)}
                  </span>
                </div>

              </div>

              <button
                class="btn secondary"
                onclick="linkContact(${c.id})">

                ${c.linked
                  ?"🔗 Vinculada"
                  :"Vincular"}

              </button>

            </div>

          `).join("")
          :
          `
          <div class="alert alert-warn">
            Todavía no has añadido ninguna persona.
            Puedes hacerlo después.
          </div>
          `
        }

      `
    },

    {
      title:"🔐 Privacidad",
      text:"Tú decides qué compartes.",
      content:`

        ${setting(
          "checkin",
          "💚 Check-in",
          "Permitir compartir check-ins"
        )}

        ${setting(
          "wellness",
          "🌷 Bienestar",
          "Permitir compartir estado"
        )}

        ${setting(
          "activity",
          "🚶 Actividades",
          "Permitir compartir actividades"
        )}

      `
    },

    {
      title:"🎁 Prueba gratuita",
      text:"Prueba las funciones avanzadas.",
      content:`

        <div class="alert alert-warn">

          <b>14 días gratis</b>

          <br><br>

          Puedes probar las funciones
          avanzadas durante 14 días.

        </div>

        <button
          class="btn secondary block"
          onclick="trial()">
          🎁 Activar prueba
        </button>

      `
    },

    {
      title:"✅ Todo preparado",
      text:"Ya puedes entrar en SerCerca.",
      content:`

        <div class="grid g3">

          <div class="stat">
            ❤️
            <b>Confianza</b>
            <span class="muted">
              Personas elegidas por ti.
            </span>
          </div>

          <div class="stat">
            💚
            <b>Check-in</b>
            <span class="muted">
              Mucho más completo.
            </span>
          </div>

          <div class="stat">
            🔐
            <b>Privacidad</b>
            <span class="muted">
              Tú decides qué compartir.
            </span>
          </div>

        </div>

      `
    }

  ];

  const x=steps[S.step-1];

  return `

    <main>

      <div
        class="card"
        style="max-width:720px;margin:20px auto">

        <div class="small">
          PASO ${S.step} DE ${steps.length}
        </div>

        <div class="progress">

          <span
            style="
            width:${S.step/steps.length*100}%
            ">
          </span>

        </div>

        <h1>${x.title}</h1>

        <p class="muted">
          ${x.text}
        </p>

        ${x.content}

        <div class="actions">

          <button
            class="btn light"
            onclick="backSetup()">
            ← Atrás
          </button>

          <button
            class="btn primary"
            onclick="nextSetup()">

            ${
              S.step===steps.length
              ?"🚀 Entrar"
              :"Continuar →"
            }

          </button>

        </div>

      </div>

    </main>

  `;

}
function nextSetup(){

  if(S.step===2){

    S.profile.name=
      document.getElementById("pname").value.trim();

    S.profile.phone=
      document.getElementById("pphone").value.trim();

    S.profile.city=
      document.getElementById("pcity").value.trim();

  }

  if(S.step===3){

    const n=
      document.getElementById("cname");

    if(n && n.value.trim()){

      S.contacts.push({

        id:Date.now(),

        name:n.value.trim(),

        email:
          document
            .getElementById("cemail")
            .value.trim(),

        relation:
          document
            .getElementById("crelation")
            .value,

        linked:false

      });

    }

  }

  if(S.step===7){

    S.onboarding=false;
    S.page="home";

    addHistory(
      "Configuración inicial",
      "Completada"
    );

    save();
    render();

    toast("❤️ Bienvenido a SerCerca.");

    return;

  }

  S.step++;

  save();
  render();

}

function backSetup(){

  if(S.step>1){

    S.step--;

    save();
    render();

  }

}

    case"checkin":
      return checkin();

    case"people":
      return people();

    case"messages":
      return messages();

    case"family":
      return family();

    case"notifications":
      return notificationsPage();

    case"history":
      return historyPage();

    case"plans":

function startCheckin(){

  if(!S.wellness.questionIndex){
    S.wellness.answers={};
  }

  S.page="checkin";

  save();
  render();

}

function checkin(){

  const total=QUESTIONS.length;

  const index=
    S.wellness.questionIndex||0;

  if(index>=total){

    return checkinSummary();

  }

  const q=QUESTIONS[index];

  return `

    <div
      class="card"
      style="max-width:750px;margin:auto">

      <div class="small">
        CHECK-IN · ${index+1} DE ${total}
      </div>

      <div class="progress">

        <span
          style="
          width:${(index+1)/total*100}%
          ">
        </span>

      </div>

      <h1>${q.title}</h1>

      <p class="muted">
        Pulsa una respuesta para continuar.
      </p>

      ${q.options.map(o=>`

        <button
          class="choice"
          onclick='answer(${JSON.stringify(q.id)},${JSON.stringify(o[1])})'>

          <span class="emoji">
            ${o[0]}
          </span>

          <b>${esc(o[1])}</b>

        </button>

      `).join("")}

      <div class="actions">

        <button
          class="btn light"
          onclick="previousQuestion()">
          ← Atrás
        </button>

        <button
          class="btn light"
          onclick="cancelCheckin()">
          Salir
        </button>

      </div>

    </div>

  `;

}

function answer(id,value){

  S.wellness.answers[id]=value;

  if(id==="activity"){
    S.wellness.activity=value;
  }

  S.wellness.questionIndex=
    (S.wellness.questionIndex||0)+1;

  save();
  render();

}

function previousQuestion(){

  if((S.wellness.questionIndex||0)>0){

    S.wellness.questionIndex--;

    save();
    render();

  }else{

    cancelCheckin();

  }

}

function cancelCheckin(){

  S.wellness.questionIndex=0;
  S.wellness.answers={};
  S.wellness.activity="";

  save();

  go("home");

}

  const recommendations=

  return `

      </p>

        ${

            ([key,value])=>`

                  <b>
                    ${questionName(key)}
                  </b>

                  <br>

                    ${esc(value)}
                  </span>

                </div>

                <span>✓</span>

              </div>

            `
          ).join("")

      <hr>

      <h2>💡 Una idea para tu día</h2>

          class="btn light"
          onclick="cancelCheckin()">
          No guardar
        </button>

        <button
          class="btn secondary"
          onclick="saveCheckin(false)">
          💾 Guardar sin compartir
        </button>

        <button
          class="btn primary"
          onclick="confirmShare()">
          💌 Compartir
        </button>

      </div>

    </div>

  `;

}
function questionName(id){

  const names={
    mood:"Estado de ánimo",
    sleep:"Sueño",
    food:"Alimentación",
    water:"Agua",
    pain:"Dolor",
    medicine:"Medicamentos",
    outside:"Salir de casa",
    social:"Contacto social",
    company:"Acompañamiento",
    need:"Necesidad",
    activity:"Actividad"
  };

  return names[id]||id;

}
