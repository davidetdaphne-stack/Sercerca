<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>SerCerca 💚</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f3f8f5;
  color: #17332b;
  padding-bottom: 90px;
}

button,
input,
textarea,
select {
  font-family: inherit;
}


/* =========================================================
   HEADER
========================================================= */

header {
  background: #17332b;
  color: white;
  text-align: center;
  padding: 28px 15px;
}

header h1 {
  margin: 0;
  font-size: 38px;
}

header h1 span {
  color: #9ed1bd;
}

header p {
  margin: 10px 0 0;
  line-height: 1.5;
}


/* =========================================================
   MAIN
========================================================= */

main {
  max-width: 720px;
  margin: auto;
  padding: 18px;
}

.page {
  display: none;
}

.page.active {
  display: block;
}


/* =========================================================
   CARDS
========================================================= */

.card {
  background: white;
  padding: 23px;
  margin-bottom: 18px;
  border-radius: 22px;
  box-shadow: 0 4px 18px rgba(0,0,0,.08);
}

.card h1,
.card h2,
.card h3 {
  line-height: 1.3;
}

p {
  line-height: 1.6;
}


/* =========================================================
   BUTTONS
========================================================= */

button {
  width: 100%;
  border: none;
  border-radius: 15px;
  padding: 16px;
  margin: 7px 0;
  font-size: 16px;
  font-weight: bold;
  background: #2f6f5e;
  color: white;
  cursor: pointer;
  transition: .15s;
}

button:hover {
  opacity: .92;
  transform: translateY(-1px);
}

button:active {
  transform: scale(.99);
}

.secondary {
  background: #e7f2ed;
  color: #17332b;
}

.danger {
  background: #a33d3d;
}

.dark {
  background: #17332b;
}

.gold {
  background: #8a7040;
}

.pink {
  background: #b8758d;
}


/* =========================================================
   FORMS
========================================================= */

label {
  display: block;
  font-weight: bold;
  margin-top: 12px;
  margin-bottom: 5px;
}

input,
textarea,
select {
  width: 100%;
  padding: 14px;
  border: 1px solid #cbdcd4;
  border-radius: 12px;
  margin: 5px 0 14px;
  font-size: 16px;
  background: white;
  color: #17332b;
}

textarea {
  min-height: 110px;
  resize: vertical;
}

input:focus,
textarea:focus,
select:focus {
  outline: 3px solid rgba(47,111,94,.15);
  border-color: #2f6f5e;
}


/* =========================================================
   MESSAGES
========================================================= */

.message {
  display: none;
  padding: 17px;
  margin-top: 15px;
  border-radius: 15px;
  background: #edf7f1;
  line-height: 1.6;
}

.message.show {
  display: block;
}

.success {
  background: #edf7f1;
  border-left: 5px solid #2f6f5e;
  padding: 17px;
  border-radius: 15px;
  line-height: 1.6;
  margin-top: 15px;
}

.notice {
  background: #e9f5ff;
  padding: 17px;
  border-radius: 15px;
  margin: 15px 0;
  line-height: 1.6;
}

.warning {
  background: #fff7e5;
  padding: 17px;
  border-radius: 15px;
  margin: 15px 0;
  line-height: 1.6;
}

.hidden {
  display: none !important;
}


/* =========================================================
   PERSONAS
========================================================= */

.persona {
  background: #f3f8f5;
  padding: 16px;
  border-radius: 15px;
  margin: 10px 0;
}

.persona-actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.persona-actions button {
  margin: 0;
  padding: 11px;
  font-size: 13px;
}

.persona-actions .delete {
  background: #a33d3d;
}


/* =========================================================
   PLANES
========================================================= */

.plan {
  border: 2px solid #d7e7df;
  border-radius: 20px;
  padding: 20px;
  margin: 15px 0;
  background: white;
}

.plan.selected {
  border-color: #2f6f5e;
  background: #f1f8f4;
}

.plan h3 {
  margin-top: 0;
}

.price {
  font-size: 30px;
  font-weight: bold;
  margin: 8px 0;
}

.feature {
  margin: 9px 0;
}

.badge {
  display: inline-block;
  padding: 7px 11px;
  border-radius: 20px;
  background: #dceee6;
  color: #17332b;
  font-weight: bold;
  font-size: 13px;
}


/* =========================================================
   RECOMENDACIONES
========================================================= */

.recommendation {
  background: #f4faf7;
  border-radius: 16px;
  padding: 17px;
  margin: 12px 0;
}

.recommendation h3 {
  margin-top: 0;
}


/* =========================================================
   CHECK-IN
========================================================= */

.checkin-question {
  font-size: 18px;
  font-weight: bold;
  margin-top: 20px;
}


/* =========================================================
   NAVEGACIÓN
========================================================= */

nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 100;
  display: flex;
  gap: 4px;
  padding: 8px;
  background: white;
  border-top: 1px solid #ddd;
  box-shadow: 0 -3px 12px rgba(0,0,0,.06);
}

nav button {
  flex: 1;
  margin: 0;
  padding: 9px 3px;
  font-size: 11px;
  background: white;
  color: #17332b;
}

nav button.active-nav {
  background: #e7f2ed;
}


/* =========================================================
   PEQUEÑOS
========================================================= */

.small {
  color: #587168;
  font-size: 14px;
}

.center {
  text-align: center;
}

.divider {
  height: 1px;
  background: #e0e9e5;
  margin: 20px 0;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 600px) {

  header h1 {
    font-size: 31px;
  }

  main {
    padding: 12px;
  }

  .card {
    padding: 18px;
  }

  nav button {
    font-size: 10px;
  }

}

</style>

</head>


<body>

     CABECERA

    Ser<span>Cerca</span> 💚
  </h1>

  <p>
    No estamos para vigilarte.<br>
    Estamos para estar cerca.
  </p>

</header>


<main>


<!-- =====================================================
     BIENVENIDA
===================================================== -->

<section
